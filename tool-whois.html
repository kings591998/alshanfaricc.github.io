<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة Whois - معلومات النطاقات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #eee;
            font-family: 'Segoe UI', system-ui, sans-serif;
            direction: rtl;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #0C0F17;
            border-radius: 1.5rem;
            padding: 2rem;
            border: 1px solid #D4AF37;
        }
        h1 {
            color: #D4AF37;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        input {
            width: 100%;
            padding: 0.8rem;
            background: #1a1c25;
            border: 1px solid #2a2a35;
            border-radius: 1rem;
            color: white;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        button {
            background: #D4AF37;
            color: #000;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            background: #1a1c25;
            border-radius: 1rem;
            padding: 1rem;
            margin-top: 1.5rem;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.85rem;
            direction: ltr;
            text-align: left;
            max-height: 400px;
            overflow: auto;
        }
        .error {
            color: #ff8888;
            text-align: center;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            color: #666;
            font-size: 0.8rem;
        }
        .note {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌐 استعلام معلومات النطاق (Whois)</h1>
    <input type="text" id="domainInput" placeholder="أدخل اسم النطاق (مثل: google.com)">
    <button id="lookupBtn">🔍 استعلام</button>
    <div class="note">⚠️ ملاحظة: قد تكون المعلومات غير كاملة لبعض النطاقات بسبب سياسات الخوادم.</div>
    <div id="resultArea" class="result">✏️ سوف تظهر معلومات النطاق هنا...</div>
</div>
<footer>أداة مجانية من منصة أوج | تعمل عبر API خارجي</footer>

<script>
    const domainInput = document.getElementById('domainInput');
    const lookupBtn = document.getElementById('lookupBtn');
    const resultArea = document.getElementById('resultArea');

    async function lookupWhois() {
        let domain = domainInput.value.trim();
        if (!domain) {
            resultArea.innerHTML = '<div class="error">⚠️ الرجاء إدخال اسم نطاق صحيح</div>';
            return;
        }
        // إزالة http:// أو https:// إذا وجدت
        domain = domain.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
        
        lookupBtn.disabled = true;
        lookupBtn.textContent = 'جاري الاستعلام...';
        resultArea.innerHTML = '⏳ جلب معلومات النطاق...';
        
        try {
            // استخدام API مجاني من ip-api.com (هذا لا يعطي Whois كاملاً، لكنه يظهر معلومات DNS بسيطة)
            // بدلاً من ذلك، يمكن استخدام Whoisfreaks API (محدود) أو خدمة مجانية أخرى.
            // هنا سنستخدم api.allorigins.win لتجنب مشاكل CORS ونعرض معلومات تجريبية.
            // ملاحظة: Whois الحقيقي يتطلب خادمًا وسيطًا. لهذا العرض، سنقدم معلومات بسيطة.
            
            // للعرض التوضيحي، سنعرض بيانات محاكاة من خدمة whois.domaintools.com (لكنها لا تدعم CORS بسهولة)
            // سأستخدم خدمة مجانية لا تحتاج مفتاح: `https://whoisjson.com` (محدودة)
            // لكن الأفضل أن أنشئ خدمة وهمية تعرض مثالاً.
            // لضمان عمل الأداة، سنستخدم URL التابع لـ ip-api.com للحصول على معلومات IP الخاصة بالنطاق.
            
            // الحل العملي: استخدام واجهة مجانية تعرض بيانات Whois عبر خدمة مجانية.
            // بما أنك ستستخدم الأداة داخل iframe في موقعك، يمكنك ربطها بـ API مجاني مثل:
            // https://api.whoisapi.net (يتطلب مفتاح)
            // للتبسيط، سأعرض معلومات توضيحية ثابتة مع إمكانية البحث عن النطاق عبر DNS (جلب عنوان IP).
            
            // سأستخدم dns.google/resolve لجلب معلومات DNS فقط (بديل سريع)
            const dnsRes = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
            const dnsData = await dnsRes.json();
            
            if (dnsData && dnsData.Answer && dnsData.Answer.length > 0) {
                const ips = dnsData.Answer.map(a => a.data).join(', ');
                resultArea.innerHTML = `
                    <strong>✅ معلومات النطاق: ${domain}</strong><br>
                    📍 عناوين IP: ${ips}<br>
                    🕒 تاريخ الاستعلام: ${new Date().toLocaleString()}<br>
                    ℹ️ لم يتم توفير معلومات Whois كاملة بسبب قيود API. يمكنك استخدام خدمات متخصصة مثل whois.domaintools.com.
                `;
            } else {
                resultArea.innerHTML = `<div class="error">❌ لا يمكن العثور على معلومات للنطاق ${domain}</div>`;
            }
        } catch (err) {
            resultArea.innerHTML = `<div class="error">❌ خطأ في الاتصال: ${err.message}</div>`;
        } finally {
            lookupBtn.disabled = false;
            lookupBtn.textContent = '🔍 استعلام';
        }
    }

    lookupBtn.addEventListener('click', lookupWhois);
    domainInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') lookupWhois();
    });
</script>
</body>
</html>
