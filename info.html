<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALSHANFRICC | Info</title>
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { width: 90%; max-width: 500px; border: 1px solid #D4AF37; padding: 40px; background: #000; position: relative; }
        .tabs { display: flex; gap: 20px; border-bottom: 1px solid #333; margin-bottom: 20px; padding-bottom: 10px; }
        .tab { cursor: pointer; color: #666; font-size: 0.8em; letter-spacing: 2px; }
        .tab.active { color: #D4AF37; font-weight: bold; border-bottom: 2px solid #D4AF37; }
        .content { display: none; line-height: 1.6; }
        .content.active { display: block; }
        .back-btn { position: absolute; top: -15px; left: 15px; background: #000; color: #D4AF37; border: 1px solid #D4AF37; padding: 2px 10px; text-decoration: none; font-size: 0.7em; }
    </style>
</head>
<body>
    <div class="box">
        <a href="index.html" class="back-btn">RETURN TO CORE</a>
        <div class="tabs">
            <div class="tab active" onclick="openTab(event, 'about')">ABOUT</div>
            <div class="tab" onclick="openTab(event, 'privacy')">PRIVACY</div>
        </div>
        <div id="about" class="content active">
            <h2 style="color:#D4AF37;">Narrative Architect</h2>
            <p>Specializing in constructing high-impact symbolic identities.</p>
        </div>
        <div id="privacy" class="content">
            <h2 style="color:#D4AF37;">Privacy Protocol</h2>
            <p>Your digital footprint is protected under our sovereign encryption.</p>
        </div>
    </div>
    <script>
        function openTab(e, id) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            e.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
