<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المقال - ALSHANFRICC</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --bg: #000;
            --text: #fff;
            --cyan: #00ffff;
            --gray: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Tajawal', sans-serif;
            line-height: 1.9;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        /* Reading Progress Bar */
        #progress-bar {
            position: fixed;
            top: 0;
            right: 0;
            height: 4px;
            background: var(--gold);
            width: 0%;
            z-index: 1000;
        }

        /* Back Button */
        .back-btn {
            position: absolute;
            top: 0;
            left: 0;
            color: var(--gold);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Article Header */
        h1 {
            color: var(--gold);
            font-size: 2.5rem;
            margin-top: 60px;
            margin-bottom: 20px;
        }

        .info-bar {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 30px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .info-bar span {
            margin-left: 15px;
        }

        /* Table of Contents */
        #toc {
            background: rgba(212, 175, 55, 0.08);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 40px;
            display: none;
        }

        #toc h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--gold);
        }

        #toc ul {
            list-style: none;
        }

        #toc a {
            color: var(--text);
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s;
        }

        #toc a:hover {
            color: var(--gold);
        }

        /* Article Content Styling */
        .content h2 {
            color: var(--text);
            border-right: 5px solid var(--gold);
            padding-right: 15px;
            margin: 40px 0 20px;
        }

        .content h3 {
            color: var(--cyan);
            margin: 30px 0 15px;
        }

        .content p {
            font-size: 17px;
            margin-bottom: 20px;
        }

        .content .quote {
            background: #1a1a1a;
            border-right: 5px solid var(--cyan);
            padding: 20px;
            margin: 30px 0;
            font-style: italic;
            color: #ccc;
        }

        .content img {
            width: 100%;
            border-radius: 15px;
            margin: 30px 0;
        }

        /* Footer */
        .share-section {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #222;
        }

        .share-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .share-btn {
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            font-family: inherit;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .share-btn:hover {
            transform: translateY(-2px);
        }

        .btn-tg { background: #0088cc; color: white; }
        .btn-tw { background: #1da1f2; color: white; }
        .btn-wa { background: #25d366; color: white; }
        .btn-copy { background: var(--gold); color: black; }

        .related-articles {
            margin-top: 50px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .related-card {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            transition: background 0.3s;
        }

        .related-card:hover {
            background: #222;
        }

        .related-card h4 {
            color: var(--gold);
            margin-bottom: 10px;
        }

        /* Back to Top */
        #back-to-top {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--gold);
            color: black;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            border: none;
            z-index: 100;
        }

        /* Dark/Light Mode (Inherited from index - simplified here) */
        body.light-mode {
            background-color: #fff;
            color: #000;
        }
        body.light-mode .content h2, body.light-mode .content p { color: #000; }
        body.light-mode .related-card { background: #f0f0f0; color: #000; }
    </style>
</head>
<body>
    <div id="progress-bar"></div>
    <button id="back-to-top">↑</button>

    <div class="container">
        <a href="index.html" class="back-btn">← العودة للرئيسية</a>
        
        <header>
            <h1 id="article-title">جاري التحميل...</h1>
            <div class="info-bar">
                <span id="views">👁 0</span>
                <span id="hijri-date">📅 --</span>
                <span id="tag">#الوسم</span>
            </div>
        </header>

        <nav id="toc">
            <h2>📑 فهرس المقال</h2>
            <ul id="toc-list"></ul>
        </nav>

        <article class="content" id="article-content">
            <!-- Content will be injected here -->
        </article>

        <section class="share-section">
            <h3>مشاركة المقال:</h3>
            <div class="share-buttons">
                <button class="share-btn btn-tg" onclick="share('telegram')">تلجرام</button>
                <button class="share-btn btn-tw" onclick="share('twitter')">تويتر</button>
                <button class="share-btn btn-wa" onclick="share('whatsapp')">واتساب</button>
                <button class="share-btn btn-copy" onclick="copyLink()">نسخ الرابط</button>
            </div>
        </section>

        <section class="related-articles">
            <h3>مقالات ذات صلة:</h3>
            <div class="related-grid" id="related-grid">
                <!-- Related articles will be injected here -->
            </div>
        </section>
    </div>

    <script>
        let startTime = Date.now();
        let articleId = new URLSearchParams(window.location.search).get('id');

        window.onload = () => {
            document.body.classList.add('loaded');
            loadArticle();
            checkTheme();
        };

        function checkTheme() {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
            }
        }

        function loadArticle() {
            const articles = JSON.parse(localStorage.getItem('alshanfricc_articles') || '[]');
            const article = articles.find(a => a.id == articleId);

            if (!article) {
                document.getElementById('article-title').innerText = "المقال غير موجود";
                return;
            }

            // Update Views
            article.views = (article.views || 0) + 1;
            localStorage.setItem('alshanfricc_articles', JSON.stringify(articles));

            // Set Meta Info
            document.getElementById('article-title').innerText = article.title;
            document.getElementById('views').innerText = `👁 ${article.views}`;
            document.getElementById('hijri-date').innerText = `📅 ${article.hijriDate || '1447/10/15'}`;
            document.getElementById('tag').innerText = `#${article.tag}`;

            // Process Content
            const processedContent = parseMarkdown(article.content);
            document.getElementById('article-content').innerHTML = processedContent;

            // Build TOC
            buildTOC();

            // Load Related
            loadRelated(article.tag, article.id, articles);
        }

        function parseMarkdown(md) {
            let html = md
                .replace(/^## (.*$)/gim, (match, p1, offset) => `<h2 id="sec-${offset}">${p1}</h2>`)
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^> (.*$)/gim, '<div class="quote">$1</div>')
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>');
            
            // Handle paragraphs (simple version)
            return html.split('\n\n').map(p => p.startsWith('<') ? p : `<p>${p}</p>`).join('');
        }

        function buildTOC() {
            const headings = document.querySelectorAll('.content h2');
            const toc = document.getElementById('toc');
            const tocList = document.getElementById('toc-list');

            if (headings.length > 1) {
                toc.style.display = 'block';
                headings.forEach(h => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `#${h.id}`;
                    a.innerText = h.innerText;
                    a.onclick = (e) => {
                        e.preventDefault();
                        document.getElementById(h.id).scrollIntoView({ behavior: 'smooth' });
                    };
                    li.appendChild(a);
                    tocList.appendChild(li);
                });
            }
        }

        function loadRelated(tag, currentId, allArticles) {
            const related = allArticles
                .filter(a => a.tag === tag && a.id != currentId)
                .slice(0, 3);
            
            const grid = document.getElementById('related-grid');
            related.forEach(a => {
                const card = document.createElement('a');
                card.className = 'related-card';
                card.href = `article.html?id=${a.id}`;
                card.innerHTML = `<h4>${a.title}</h4><p>${a.content.substring(0, 50)}...</p>`;
                grid.appendChild(card);
            });
        }

        // Scroll Progress & Back to Top
        window.onscroll = () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById("progress-bar").style.width = scrolled + "%";

            const btt = document.getElementById('back-to-top');
            if (winScroll > 300) {
                btt.style.display = "flex";
            } else {
                btt.style.display = "none";
            }
        };

        document.getElementById('back-to-top').onclick = () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Share Functions
        function share(platform) {
            const url = window.location.href;
            const text = document.getElementById('article-title').innerText;
            let shareUrl = '';

            switch(platform) {
                case 'telegram': shareUrl = `https://t.me/share/url?url=${url}&text=${text}`; break;
                case 'twitter': shareUrl = `https://twitter.com/intent/tweet?url=${url}&text=${text}`; break;
                case 'whatsapp': shareUrl = `https://api.whatsapp.com/send?text=${text} ${url}`; break;
            }
            window.open(shareUrl, '_blank');
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('تم نسخ الرابط!');
        }

        // Reading Session Tracking
        window.onbeforeunload = () => {
            let duration = Math.floor((Date.now() - startTime) / 1000);
            if (duration > 5) {
                let sessions = JSON.parse(localStorage.getItem('readSessions') || '[]');
                sessions.push({
                    id: articleId,
                    duration: duration,
                    date: new Date().toISOString()
                });
                localStorage.setItem('readSessions', JSON.stringify(sessions));
            }
        };
    </script>
</body>
</html>
