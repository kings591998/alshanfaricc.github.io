<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALSHANFRICC | النواة السيادية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --black: #050505; }
        
        body { 
            background: var(--black); 
            margin: 0; 
            padding: 0;
            overflow-x: hidden; 
            transition: background 0.5s ease;
        }

        /* تحسين وضوح الشبكة العصبية للكمبيوتر والجوال */
        #neural-canvas { 
            position: fixed; 
            inset: 0; 
            z-index: -1; 
            opacity: 0.6; 
            pointer-events: none; 
            background: radial-gradient(circle at center, #0a0a0a 0%, #050505 100%);
        }

        .module-frame { 
            width: 100%; 
            border: none; 
            display: block; 
            background: transparent;
        }

        /* أزرار التحكم الجانبية الفخمة */
        .controls { 
            position: fixed; 
            left: 20px; 
            top: 50%; 
            transform: translateY(-50%); 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .btn { 
            width: 45px; 
            height: 45px; 
            border: 1px solid var(--gold); 
            border-radius: 50%; 
            color: var(--gold); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            background: rgba(0,0,0,0.8); 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            font-size: 1.1em;
        }

        .btn:hover { 
            background: var(--gold); 
            color: #000; 
            box-shadow: 0 0 20px var(--gold); 
            transform: scale(1.1);
        }

        /* عداد فك التشفير (التمرير) */
        #scroll-pct { 
            position: fixed; 
            bottom: 20px; 
            right: 30px; 
            color: var(--gold); 
            font-size: 0.75em; 
            letter-spacing: 3px; 
            z-index: 1000; 
            opacity: 0.6;
            font-family: monospace;
        }

        /* وضع الإضاءة */
        .light-mode { filter: invert(1) hue-rotate(180deg); background: #fff; }
    </style>
</head>
<body>

<canvas id="neural-canvas"></canvas>

<div class="controls">
    <div class="btn" onclick="document.body.classList.toggle('light-mode')" title="تبديل الإضاءة"><i class="fas fa-eye"></i></div>
    <div class="btn" onclick="window.history.back()" title="الرجوع"><i class="fas fa-chevron-left"></i></div>
    <div class="btn" onclick="window.scrollTo({top:0, behavior:'smooth'})" title="الأعلى"><i class="fas fa-arrow-up"></i></div>
</div>

<div id="scroll-pct">0% DECODED</div>

<iframe src="header.html" class="module-frame" style="height: 450px;" id="header-frame"></iframe>

<iframe src="articles.html" class="module-frame" style="height: 2500px;" id="articles-frame"></iframe>

<iframe src="footer.html" class="module-frame" style="height: 150px;"></iframe>

<script>
    // تحديث عداد التمرير (L2)
    window.onscroll = () => {
        let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        let scrolled = Math.round((winScroll / height) * 100);
        document.getElementById("scroll-pct").innerText = scrolled + "% DECODED";
    };

    // برمجة الشبكة العصبية المطورة (L4/L5)
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];

    function resize() { 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
    }
    window.onresize = resize; 
    resize();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = (Math.random() - 0.5) * 0.4;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
    }

    // زيادة عدد الجسيمات للكمبيوتر
    const particleCount = window.innerWidth > 768 ? 85 : 40;
    for (let i = 0; i < particleCount; i++) pts.push(new Particle());

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "rgba(212,175,55,0.25)"; // توهج ذهبي خفيف
        ctx.lineWidth = 0.8;

        pts.forEach((p, i) => {
            p.update();
            for (let j = i + 1; j < pts.length; j++) {
                let dist = Math.hypot(p.x - pts[j].x, p.y - pts[j].y);
                if (dist < 180) { // مدى الاتصال
                    ctx.beginPath();
                    ctx.globalAlpha = 1 - (dist / 180);
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(pts[j].x, pts[j].y);
                    ctx.stroke();
                }
            }
        });
        ctx.globalAlpha = 1;
        requestAnimationFrame(draw);
    }
    draw();

    // حيلة "الصوت النحاسي" عند التفاعل (اختياري)
    function playClick() {
        const audio = new Audio('https://www.soundjay.com/buttons/button-50.mp3');
        audio.volume = 0.1;
        audio.play();
    }
</script>
</body>
</html>
