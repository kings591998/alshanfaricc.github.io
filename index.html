<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">ALSHANFRICC</title>
    <meta name="description" content="موسوعة ALSHANFRICC التاريخية">
    <link id="dynamic-font-link" rel="stylesheet" href="">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="instant-header"></div>
    <script>
        (function(){
            try {
                var raw = localStorage.getItem('alshanfricc_settings_cache');
                if (raw) {
                    var s = JSON.parse(raw).settings;
                    if (s) {
                        var header = document.getElementById('instant-header');
                        if (header) {
                            header.innerHTML = '<div style="background:rgba(0,0,0,0.4);color:white;padding:12px 20px;font-size:1.8rem;font-weight:bold;text-align:center;backdrop-filter:blur(10px);position:fixed;top:0;left:0;right:0;z-index:1000;">'+(s.siteName||'ALSHANFRICC')+'</div>';
                            document.body.style.paddingTop = '60px';
                        }
                        document.documentElement.style.setProperty('--primary', s.primaryColor||'#8b5e3c');
                        document.body.style.fontFamily = (s.bodyFont||'Amiri')+', serif';
                    }
                }
            }catch(e){}
        })();
    </script>
    <header id="site-header"></header>
    <main class="main-layout">
        <section id="posts-feed" class="feed"></section>
        <aside class="right-sidebar">
            <div class="sticky-widget"><h4>روابط سريعة</h4><div id="sidebar-buttons"></div></div>
        </aside>
    </main>
    <footer id="site-footer"></footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/security-layer.js"></script>
    <script src="assets/js/config/databases.js"></script>
    <script src="assets/js/config/ai-models.js"></script>
    <script src="assets/js/config/bots.js"></script>
    <script src="assets/js/core/database-manager.js"></script>
    <script src="assets/js/core/auto-publisher.js"></script>
    <script src="assets/js/core/telegram-manager.js"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/body.js"></script>
    <script src="assets/js/footer.js"></script>

    <script>
        (function() {
            const savedFont = localStorage.getItem('selectedFont') || 'Amiri';
            const link = document.getElementById('dynamic-font-link');
            link.href = `https://fonts.googleapis.com/css2?family=${savedFont.replace(/ /g, '+')}:wght@400;700&display=swap`;
            document.body.style.fontFamily = savedFont + ', serif';
        })();
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await buildHeader();
                await loadPosts(1);
                await buildFooter();
                const siteName = await getSetting('siteName', 'ALSHANFRICC');
                document.getElementById('page-title').textContent = siteName;
                const instant = document.getElementById('instant-header');
                if (instant) instant.style.display = 'none';
                console.log('✅ تم تحميل الموقع بنجاح');
            } catch (error) { console.error('❌ خطأ في تحميل الموقع:', error); }
        });
    </script>
</body>
</html>
