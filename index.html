<!DOCTYPE html>
<html lang="en" dir="ltr" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALSHANFRICC | Core</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --black: #050505; }
        body { background: var(--black); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; direction: ltr; }
        #neural-canvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; opacity: 0.4; }
        header { text-align: center; padding: 60px 20px; }
        .logo { color: var(--gold); font-size: 3em; letter-spacing: 12px; font-weight: bold; }
        .social-icons { display: flex; justify-content: center; gap: 20px; margin: 25px 0; }
        .social-icons a { color: var(--gold); border: 1px solid var(--gold); width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 50%; text-decoration: none; transition: 0.3s; }
        .social-icons a:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold); }

        .article-card { max-width: 850px; margin: 30px auto; background: rgba(15,15,15,0.9); border: 1px solid #333; display: flex; position: relative; }
        .category-tag { position: absolute; top: 10px; right: 10px; background: var(--gold); color: #000; padding: 2px 12px; font-size: 0.7em; font-weight: bold; }
        .article-img { width: 300px; background: #111; border-right: 1px solid var(--gold); }
        .article-content { padding: 30px; flex: 1; }
        .article-content h2 { color: var(--gold); margin: 0 0 15px 0; }
        .read-more { color: var(--gold); text-decoration: none; font-weight: bold; display: inline-block; margin-top: 15px; border-bottom: 1px solid var(--gold); }
        
        .actions { display: flex; gap: 15px; margin-top: 20px; }
        .act-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 6px 15px; cursor: pointer; font-size: 0.8em; }

        .side-nav { position: fixed; bottom: 30px; left: 30px; display: flex; flex-direction: column; gap: 12px; }
        .nav-btn { width: 50px; height: 50px; border-radius: 50%; border: 1.2px solid var(--gold); background: #000; color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .parallel-arrows { display: flex; gap: 5px; }

        #toast { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 6px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8em; display: none; z-index: 9999; }
    </style>
</head>
<body>
<canvas id="neural-canvas"></canvas>
<div id="toast">Link Copied</div>
<header>
    <div class="logo">ALSHANFRICC</div>
    <div class="social-icons">
        <a href="#"><i class="fab fa-x-twitter"></i></a>
        <a href="#"><i class="fab fa-telegram-plane"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
    </div>
</header>

<div class="article-card">
    <div class="category-tag">INVESTMENT ARCH.</div>
    <div class="article-img"></div>
    <div class="article-content">
        <h2>The Neural Logic of Assets</h2>
        <p>Exploring the intersection of cognitive patterns and market trends in 2026.</p>
        <a href="#" class="read-more">READ MORE...</a>
        <div class="actions">
            <button class="act-btn" onclick="copy()"><i class="fas fa-copy"></i> Copy</button>
            <button class="act-btn" onclick="share()"><i class="fas fa-share-nodes"></i> Share</button>
        </div>
    </div>
</div>

<div class="side-nav">
    <div class="nav-btn" onclick="toggle()"><i class="fas fa-moon"></i></div>
    <div class="parallel-arrows">
        <div class="nav-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></div>
        <div class="nav-btn">∥</div>
    </div>
    <div class="nav-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})"><i class="fas fa-arrow-up"></i></div>
</div>

<footer>
    <div style="text-align:center; padding: 50px; border-top: 1px solid var(--gold); margin-top: 60px;">
        <a href="info.html" style="color:#666; text-decoration:none; margin:0 15px; font-size: 0.8em;">ABOUT</a>
        <a href="info.html" style="color:#666; text-decoration:none; margin:0 15px; font-size: 0.8em;">PRIVACY</a>
        <a href="info.html" style="color:#666; text-decoration:none; margin:0 15px; font-size: 0.8em;">COPYRIGHT</a>
    </div>
</footer>

<script>
    function copy() { navigator.clipboard.writeText(window.location.href); showToast("Link Copied"); }
    function showToast(m) { const t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none', 2000); }
    function share() { if(navigator.share) { navigator.share({title:'ALSHANFRICC', url:window.location.href}); } else { copy(); } }

    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    class P {
        constructor() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.vx = (Math.random()-0.5)*0.2; this.vy = (Math.random()-0.5)*0.2; }
        update() { this.x += this.vx; this.y += this.vy; if(this.x<0||this.x>canvas.width)this.vx*=-1; if(this.y<0||this.y>canvas.height)this.vy*=-1; }
    }
    for(let i=0; i<60; i++) pts.push(new P());
    function anim() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = "rgba(212,175,55,0.1)";
        ctx.fillStyle = "rgba(212,175,55,0.4)";
        pts.forEach((p,i)=>{
            p.update();
            ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2); ctx.fill();
            for(let j=i+1; j<pts.length; j++) {
                let d = Math.hypot(p.x-pts[j].x, p.y-pts[j].y);
                if(d<160) { ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke(); }
            }
        });
        requestAnimationFrame(anim);
    }
    anim();
</script>
</body>
</html>
