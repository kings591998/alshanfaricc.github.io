<!DOCTYPE html>
<html lang="en" dir="ltr" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALSHANFRICC | Core</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --black: #050505; }
        body { background: var(--black); margin: 0; overflow-x: hidden; direction: ltr; font-family: 'Segoe UI', sans-serif; }
        #neural-canvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; opacity: 0.4; }
        .module-frame { width: 100%; border: none; display: block; overflow: hidden; }
        #scroll-pct { position: fixed; bottom: 20px; right: 30px; color: var(--gold); font-size: 0.7em; font-family: monospace; opacity: 0.6; z-index: 1000; }
        #loader { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="loader">
    <div style="text-align:center;">
        <i class="fas fa-dove" style="color:var(--gold); font-size:3.5em; animation: pulse 2s infinite;"></i>
        <div style="color:var(--gold); letter-spacing:8px; margin-top:20px; font-size:0.6em; font-weight:bold;">INITIALIZING SOVEREIGNTY...</div>
    </div>
</div>

<div id="scroll-pct">0% DECODED</div>
<canvas id="neural-canvas"></canvas>

<iframe src="header.html" class="module-frame" style="height: 280px;"></iframe>
<iframe src="articles.html" class="module-frame" style="height: 1500px;"></iframe>
<iframe src="footer.html" class="module-frame" style="height: 200px;"></iframe>

<script>
    // حماية صامتة (بدون رسائل مزعجة)
    document.addEventListener('contextmenu', event => event.preventDefault());

    // حيلة 2 (L5): تتبع الزيارات والولاء
    let visits = localStorage.getItem('visitCount') || 0;
    localStorage.setItem('visitCount', ++visits);
    if(visits > 5) document.body.style.boxShadow = "inset 0 0 100px rgba(212,175,55,0.2)";

    // الشبكة العصبية مع حيلة 3 (L5): البصمة الحرارية للماوس
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();

    class P {
        constructor(x,y,isMouse=false) { 
            this.x=x||Math.random()*canvas.width; 
            this.y=y||Math.random()*canvas.height; 
            this.vx=(Math.random()-0.5)*0.2; 
            this.vy=(Math.random()-0.5)*0.2; 
            this.life = isMouse ? 100 : undefined;
        }
        update() { 
            this.x+=this.vx; this.y+=this.vy; 
            if(this.x<0||this.x>canvas.width)this.vx*=-1; 
            if(this.y<0||this.y>canvas.height)this.vy*=-1; 
        }
    }
    for(let i=0; i<50; i++) pts.push(new P());

    window.addEventListener('mousemove', (e) => {
        pts.push(new P(e.clientX, e.clientY, true)); // أثر الماوس الذهبي
        pts.forEach(p => { p.vx += (e.clientX - canvas.width/2) * 0.000005; });
    });

    function anim() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = "rgba(212,175,55,0.1)"; ctx.fillStyle = "rgba(212,175,55,0.4)";
        pts = pts.filter(p => p.life === undefined || p.life-- > 0);
        pts.forEach((p,i)=>{
            p.update(); ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2); ctx.fill();
            for(let j=i+1; j<pts.length; j++) {
                let d = Math.hypot(p.x-pts[j].x, p.y-pts[j].y);
                if(d<150) { ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke(); }
            }
        });
        requestAnimationFrame(anim);
    }
    anim();

    window.onscroll = () => {
        let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        document.getElementById("scroll-pct").innerText = Math.round((winScroll / height) * 100) + "% DECODED";
    };

    window.addEventListener('load', () => setTimeout(()=> document.getElementById('loader').style.display='none', 1500));
</script>
</body>
</html>
