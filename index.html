<!DOCTYPE html>
<html lang="en" dir="ltr" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALSHANFRICC | Sovereign Interface</title>
    <style>
        :root {
            --gold: #D4AF37;
            --black: #050505;
            --glass: rgba(212, 175, 55, 0.08);
        }

        body { 
            background: var(--black); 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            direction: ltr; 
            overflow-x: hidden;
        }

        /* خلفية الخلايا العصبية */
        #neural-canvas { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; opacity: 0.5; }

        header { text-align: center; padding: 60px 20px; }
        header h1 { color: var(--gold); font-size: 3.5em; letter-spacing: 15px; margin: 0; text-transform: uppercase; }

        /* أيقونات التواصل الفخمة */
        .social-gold {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 20px 0;
        }
        .social-gold a {
            color: var(--gold);
            text-decoration: none;
            font-size: 1.2em;
            border: 1px solid var(--gold);
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.4s;
            background: rgba(0,0,0,0.5);
        }
        .social-gold a:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold); }

        /* الأزرار العائمة المحدثة */
        .floating-nexus {
            position: fixed;
            bottom: 40px;
            left: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }
        .nexus-btn {
            width: 55px;
            height: 55px;
            background: #000;
            border: 1.5px solid var(--gold);
            color: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .nexus-btn:hover { background: var(--gold); color: #000; }
        
        .parallel-arrows { display: flex; gap: 8px; }
        .arrow-set { font-size: 18px; font-weight: bold; }

        /* الفوتر المحدث بروابط info.html */
        footer {
            padding: 50px;
            border-top: 1px solid var(--gold);
            text-align: center;
            background: #000;
        }
        .footer-nav a {
            color: #777;
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.8em;
            letter-spacing: 1px;
        }
        .footer-nav a:hover { color: var(--gold); }
    </style>
</head>
<body>

<canvas id="neural-canvas"></canvas>

<header>
    <h1>ALSHANFRICC</h1>
    <div class="social-gold">
        <a href="#" title="X (Twitter)">𝕏</a>
        <a href="#" title="Telegram">ＴＧ</a>
        <a href="#" title="WhatsApp">ＷＡ</a>
        <a href="#" title="LinkedIn">ＩＮ</a>
    </div>
</header>

<div class="floating-nexus">
    <div class="nexus-btn" onclick="toggleTheme()">🌙</div>
    <div class="parallel-arrows">
        <div class="nexus-btn" onclick="history.back()" title="Back">⬅</div>
        <div class="nexus-btn" title="Parallel Logic">∥</div> 
    </div>
    <div class="nexus-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})">▲</div>
</div>

<footer>
    <nav class="footer-nav">
        <a href="info.html">ABOUT</a>
        <a href="info.html">PRIVACY</a>
        <a href="info.html">COPYRIGHT</a>
    </nav>
    <p style="color:var(--gold); font-size:0.7em; margin-top:20px; opacity:0.4;">© 2026 MUAAD AL-SHANFARI</p>
</footer>

<script>
    // كود الخلايا العصبية (Neural Logic)
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();

    class P {
        constructor() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.vx = (Math.random()-0.5)*0.3; this.vy = (Math.random()-0.5)*0.3; }
        update() { this.x += this.vx; this.y += this.vy; if(this.x<0||this.x>canvas.width)this.vx*=-1; if(this.y<0||this.y>canvas.height)this.vy*=-1; }
    }
    for(let i=0; i<60; i++) pts.push(new P());
    function anim() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = "rgba(212,175,55,0.1)";
        ctx.fillStyle = "rgba(212,175,55,0.4)";
        pts.forEach((p,i)=>{
            p.update();
            ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2); ctx.fill();
            for(let j=i+1; j<pts.length; j++) {
                let d = Math.hypot(p.x-pts[j].x, p.y-pts[j].y);
                if(d<150) { ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke(); }
            }
        });
        requestAnimationFrame(anim);
    }
    anim();

    function toggleTheme() {
        document.body.style.filter = document.body.style.filter === 'invert(0.9) hue-rotate(180deg)' ? 'invert(0)' : 'invert(0.9) hue-rotate(180deg)';
    }
</script>

</body>
</html>
