<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALSHANFRICC | Core</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --black: #050505; }
        body { background: var(--black); margin: 0; overflow-x: hidden; }
        #neural-canvas { position: fixed; inset: 0; z-index: -1; opacity: 0.6; pointer-events: none; }
        .module-frame { width: 100%; border: none; display: block; background: transparent; transition: 0.5s; }
        
        /* أزرار التحكم الجانبية */
        .controls { position: fixed; left: 20px; top: 50%; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 15px; }
        .btn { width: 45px; height: 45px; border: 1px solid var(--gold); border-radius: 50%; color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(0,0,0,0.8); transition: 0.3s; }
        .btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); }
        .light-mode { filter: invert(1) hue-rotate(180deg); background: #fff; }
    </style>
</head>
<body>
<canvas id="neural-canvas"></canvas>

<div class="controls">
    <div class="btn" onclick="document.body.classList.toggle('light-mode')"><i class="fas fa-eye"></i></div>
    <div class="btn" onclick="window.scrollTo({top:0, behavior:'smooth'})"><i class="fas fa-arrow-up"></i></div>
</div>

<iframe src="header.html" class="module-frame" style="height: 500px;" scrolling="no"></iframe>
<iframe src="articles.html" class="module-frame" style="height: 1500px;" scrolling="no"></iframe>
<iframe src="footer.html" class="module-frame" style="height: 150px;" scrolling="no"></iframe>

<script>
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    class P {
        constructor() {
            this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height;
            this.vx=(Math.random()-0.5)*0.4; this.vy=(Math.random()-0.5)*0.4;
        }
        update() {
            this.x+=this.vx; this.y+=this.vy;
            if(this.x<0||this.x>canvas.width)this.vx*=-1;
            if(this.y<0||this.y>canvas.height)this.vy*=-1;
        }
    }
    for(let i=0; i<(window.innerWidth>768?80:40); i++) pts.push(new P());
    function anim() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle="rgba(212,175,55,0.2)";
        pts.forEach((p,i)=>{
            p.update();
            for(let j=i+1; j<pts.length; j++){
                let d=Math.hypot(p.x-pts[j].x, p.y-pts[j].y);
                if(d<150){
                    ctx.globalAlpha=1-(d/150);
                    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke();
                }
            }
        });
        requestAnimationFrame(anim);
    }
    anim();
</script>
</body>
</html>
