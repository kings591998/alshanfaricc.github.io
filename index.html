<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALSHANFRICC | Core</title>
    <style>
        :root { --black: #050505; }
        body { background: var(--black); margin: 0; padding: 0; overflow-x: hidden; }
        #neural-canvas { position: fixed; inset: 0; z-index: -1; opacity: 0.3; pointer-events: none; }
        
        /* تثبيت الهيدر في أعلى الشاشة */
        .fixed-header-container {
            position: fixed;
            top: 0;
            width: 100%;
            height: 120px;
            z-index: 1000;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .content-body {
            margin-top: 120px; /* مساحة لكي لا يختفي المحتوى تحت الهيدر */
            width: 100%;
        }
        
        iframe { width: 100%; border: none; display: block; background: transparent; }
    </style>
</head>
<body>
<canvas id="neural-canvas"></canvas>

<div class="fixed-header-container">
    <iframe src="header.html" style="height: 100%;" scrolling="no"></iframe>
</div>

<div class="content-body">
    <iframe src="articles.html" style="height: 2500px;" scrolling="no"></iframe>
</div>

<script>
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    class P {
        constructor() {
            this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height;
            this.vx=(Math.random()-0.5)*0.2; this.vy=(Math.random()-0.5)*0.2;
        }
        update() {
            this.x+=this.vx; this.y+=this.vy;
            if(this.x<0||this.x>canvas.width)this.vx*=-1;
            if(this.y<0||this.y>canvas.height)this.vy*=-1;
        }
    }
    for(let i=0; i<35; i++) pts.push(new P());
    function anim() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle="rgba(212,175,55,0.1)";
        pts.forEach((p,i)=>{
            p.update();
            for(let j=i+1; j<pts.length; j++){
                let d=Math.hypot(p.x-pts[j].x, p.y-pts[j].y);
                if(d<150){
                    ctx.globalAlpha=1-(d/150);
                    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke();
                }
            }
        });
        requestAnimationFrame(anim);
    }
    anim();
</script>
</body>
</html>
