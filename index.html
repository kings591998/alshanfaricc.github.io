<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALSHANFRICC</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--gold:#D4AF37;--bg:#000;--text:#eee}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',Tahoma;transition:.3s}
body.light{--bg:#f5f5f5;--text:#111}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#111;position:sticky;top:0;z-index:100}
body.light header{background:#fff;border-bottom:1px solid #ddd}
.logo{color:var(--gold);font-weight:bold;font-size:20px}
.lightBtn{background:none;border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:20px;cursor:pointer}
#tabs{display:flex;overflow-x:auto;gap:8px;padding:10px;background:#0a0a0a}
body.light #tabs{background:#eee}
.tab{padding:8px 16px;background:#222;border-radius:20px;white-space:nowrap;cursor:pointer;color:#eee}
body.light.tab{background:#ddd;color:#111}
.tab.active{background:var(--gold);color:#000}
main{max-width:900px;margin:auto;padding:20px}
.card{background:#111;padding:16px;margin:12px 0;border-radius:10px;border-right:4px solid var(--gold);cursor:pointer}
body.light.card{background:#fff;border:1px solid #ddd}
footer{text-align:center;padding:30px;color:#888;margin-top:40px}
footer a{color:#888;margin:0 10px;text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="logo">ALSHANFRICC</div>
  <button class="lightBtn" onclick="toggleLight()"><i class="fa-solid fa-sun"></i> إضاءة</button>
</header>

<div id="tabs"></div>
<main><div id="content"></div></main>

<footer>
  <a href="about.html">من نحن</a>
  <a href="privacy.html">الخصوصية</a>
  <a href="cookies.html">الكوكيز</a>
  <a href="admin.html">الأدمن</a>
  <p>© 2026</p>
</footer>

<script>
function toggleLight(){
  document.body.classList.toggle('light');
  localStorage.setItem('lightMode', document.body.classList.contains('light'));
}
if(localStorage.getItem('lightMode')==='true') document.body.classList.add('light');

// تبويبات
const cats = JSON.parse(localStorage.getItem('cats') || '[{"name":"الرئيسية"},{"name":"علوم"},{"name":"تقنية"}]');
const tabs = document.getElementById('tabs');
tabs.innerHTML = cats.map((c,i)=>`<div class="tab" onclick="openTab(${i})">${c.name}</div>`).join('');

function openTab(i){
  document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));
  loadArticles(cats[i].name);
}

function loadArticles(tag){
  const arts = JSON.parse(localStorage.getItem('alshanfricc_articles') || '[]');
  const filtered = tag==='الرئيسية'? arts : arts.filter(a=>a.tags===tag);
  document.getElementById('content').innerHTML = filtered.map(a=>`
    <div class="card" onclick="location='article.html?id=${a.id}'">
      <h3 style="margin:0;color:var(--gold)">${a.title}</h3>
      <p style="color:#aaa">${(a.content||'').substring(0,100)}...</p>
    </div>
  `).join('') || '<p style="text-align:center;color:#666">لا توجد مقالات - اذهب للأدمن</p>';
}
openTab(0);

// إنشاء مقالات تجريبية إذا فارغ
if(!localStorage.getItem('alshanfricc_articles')){
  localStorage.setItem('alshanfricc_articles', JSON.stringify([
    {id:1,title:'مرحبا بك في ALSHANFRICC',content:'## البداية\nهذا أول مقال تجريبي\n## المميزات\nالموقع جاهز',tags:'الرئيسية',date:new Date().toISOString(),views:0}
  ]));
  loadArticles('الرئيسية');
}
</script>
</body>
</html>
