<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مقال</title>
<style>body{background:#000;color:#eee;font-family:'Tajawal',Tahoma;padding:20px;max-width:800px;margin:auto;line-height:1.8}h1{color:#D4AF37}a{color:#D4AF37;text-decoration:none}h2{color:#D4AF37;border-right:3px solid #D4AF37;padding-right:10px;margin-top:30px}</style>
</head>
<body>
<a href="index.html">← رجوع</a>
<div id="art"></div>
<script>
const id = new URLSearchParams(location.search).get('id');
const arts = JSON.parse(localStorage.getItem('alshanfricc_articles') || '[]');
const a = arts.find(x=>x.id==id);
if(a){
  a.views = (a.views||0)+1;
  localStorage.setItem('alshanfricc_articles', JSON.stringify(arts));
  let html = `<h1>${a.title}</h1><p style="color:#888">المشاهدات: ${a.views}</p>`;
  a.content.split('\n').forEach(line=>{
    if(line.startsWith('## ')) html += `<h2>${line.replace('## ','')}</h2>`;
    else if(line.trim()) html += `<p>${line}</p>`;
  });
  document.getElementById('art').innerHTML = html;
} else {
  document.getElementById('art').innerHTML = '<p>المقال غير موجود</p>';
}
</script>
</body>
</html>
