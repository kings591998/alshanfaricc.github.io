<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقالة</title><style>body{margin:0;background:#050505;color:#eee;font-family:Tahoma;padding:30px;max-width:800px;margin:auto}h1{color:#D4AF37}</style></head><body><div id="a"></div><script>const id=new URLSearchParams(location.search).get('id');const art=JSON.parse(localStorage.getItem('alshanfricc_articles')||'[]').find(x=>x.id==id);if(art){document.getElementById('a').innerHTML=`<a href="index.html" style="color:#D4AF37">←</a><h1>${art.title}</h1><p style="color:#00f2ff">${art.category}</p>${art.image?`<img src="${art.image}" style="width:100%;border-radius:12px">`:''}<p style="line-height:1.9">${art.content.replace(/\n/g,'<br>')}</p>`}else{document.getElementById('a').innerHTML='المقالة غير موجودة'}</script></body></html>
