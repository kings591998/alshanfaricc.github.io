<style>
    body { background: transparent; color: #fff; font-family: sans-serif; padding: 20px; }
    .card { max-width: 800px; margin: 40px auto; background: rgba(10,10,10,0.9); border: 1px solid #222; display: flex; position: relative; }
    .card-img { width: 250px; background: #111; border-right: 1px solid #333; }
    .card-txt { padding: 30px; flex: 1; }
    .card-txt h2 { color: #D4AF37; margin: 0 0 10px 0; }
    .reveal { opacity: 0; transition: 0.8s; }
    .reveal.active { opacity: 1; }
</style>

<div class="card">
    <div class="card-img"></div>
    <div class="card-txt">
        <h2 class="reveal">Sovereign Investment Architect</h2>
        <p class="reveal">Building timeless identities and symbolic narratives in the digital age.</p>
    </div>
</div>

<script>
    // حيلة L4: الكتابة التلقائية
    const obs = new IntersectionObserver((es) => {
        es.forEach(e => {
            if (e.isIntersecting && !e.target.dataset.typed) {
                const t = e.target.innerText; e.target.innerText = '';
                e.target.classList.add('active'); e.target.dataset.typed = "true";
                let i = 0; const tm = setInterval(() => {
                    if (i < t.length) { e.target.innerText += t.charAt(i); i++; }
                    else clearInterval(tm);
                }, 30);
            }
        });
    }, { threshold: 0.3 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

    // حيلة L5: الصدى السردي والردع الرقمي
    document.addEventListener('copy', (e) => {
        alert("Patience... Wisdom is not gathered in haste.");
        e.preventDefault();
    });
</script>
