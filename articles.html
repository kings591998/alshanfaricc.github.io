<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    :root { --gold: #D4AF37; }
    body { background: transparent; color: #fff; font-family: sans-serif; padding: 40px 20px; margin: 0; }
    .card { max-width: 900px; margin: 0 auto 50px auto; background: rgba(10,10,10,0.95); border: 1px solid #222; display: flex; flex-wrap: wrap; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.4s; }
    .card:hover { border-color: var(--gold); transform: translateY(-5px); }
    
    /* إصلاح مجال الصورة والمقال */
    .card-img { width: 350px; min-height: 250px; background: #111 url('https://via.placeholder.com/350x250/050505/D4AF37?text=ALSHANFRICC') center/cover; border-right: 1px solid #222; }
    .card-txt { padding: 40px; flex: 1; min-width: 300px; position: relative; }
    .card-txt h2 { color: var(--gold); margin: 0 0 15px 0; font-size: 1.8em; letter-spacing: 2px; }
    .card-txt p { color: #aaa; line-height: 1.7; font-size: 0.95em; margin-bottom: 30px; }
    
    /* الأزرار التفاعلية - حيلة L5 */
    .actions { display: flex; gap: 15px; border-top: 1px solid #222; padding-top: 20px; }
    .btn-act { background: transparent; border: 1px solid #444; color: #888; padding: 8px 15px; font-size: 0.7em; cursor: pointer; transition: 0.3s; text-decoration: none; letter-spacing: 1px; }
    .btn-act:hover { border-color: var(--gold); color: var(--gold); }
    .read-more { background: var(--gold); color: #000; border: none; font-weight: bold; }
    
    @media (max-width: 768px) { .card-img { width: 100%; border-right: none; border-bottom: 1px solid #222; } }
</style>

<div class="card">
    <div class="card-img"></div>
    <div class="card-txt">
        <h2>وصية المدينة الحجرية</h2>
        <p>استكشاف السرد الرمزي والهندسة المعمارية للاستثمارات في العصر الرقمي.</p>
        <div class="actions">
            <a href="info.html" target="_top" class="btn-act read-more">اقرأ المزيد</a>
            <button class="btn-act" onclick="copyLink()"><i class="fas fa-copy"></i> نسخ</button>
            <button class="btn-act" onclick="share()"><i class="fas fa-share-alt"></i> مشاركة</button>
        </div>
    </div>
</div>

<script>
    function copyLink() {
        navigator.clipboard.writeText(window.location.href);
        alert("تم نسخ الرابط السيادي بنجاح."); // حيلة الردع الرقمي
    }
    function share() {
        if (navigator.share) {
            navigator.share({ title: 'ALSHANFRICC', url: window.location.href });
        } else {
            alert("المشاركة غير مدعومة في هذا المتصفح.");
        }
    }
</script>
