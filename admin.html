<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - ALSHANFRICC</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <div id="login-screen">
        <form id="login-form">
            <h2>🔐 لوحة التحكم</h2>
            <p style="color:#65676b;margin-bottom:20px">الرجاء إدخال كلمة المرور</p>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول</button>
        </form>
    </div>
    <div id="admin-screen" style="display:none">
        <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
        <nav class="admin-sidebar" id="adminSidebar">
            <h3>⚙️ الإدارة</h3>
            <ul>
                <li data-section="header" class="active">🎨 الهيدر</li>
                <li data-section="body">📄 البدي</li>
                <li data-section="footer">📌 الفوتر</li>
                <li data-section="categories">📂 التبويبات</li>
                <li data-section="posts">📝 المنشورات</li>
                <li data-section="authors">✍️ الكتّاب</li>
                <li data-section="keys">🔑 المفاتيح</li>
                <li data-section="backgrounds">🖼️ الخلفيات</li>
                <li data-section="staticpages">📄 الصفحات الثابتة</li>
                <li data-section="autopublish">🤖 النشر التلقائي</li>
                <li data-section="database-manager">🗄️ قواعد البيانات</li>
            </ul>
            <div style="padding:20px;border-top:1px solid #e4e6eb;margin-top:20px">
                <button onclick="logoutAdmin()" style="width:100%">🚪 تسجيل الخروج</button>
                <a href="index.html" style="display:block;text-align:center;margin-top:10px">⬅️ العودة للموقع</a>
            </div>
        </nav>
        <main id="content-panel"><div class="loading-spinner">⏳ جاري التحميل...</div></main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/config/databases.js"></script>
    <script src="assets/js/config/ai-models.js"></script>
    <script src="assets/js/config/bots.js"></script>
    <script src="assets/js/core/database-manager.js"></script>
    <script src="assets/js/core/auto-publisher.js"></script>
    <script src="assets/js/core/telegram-manager.js"></script>
    <script src="assets/js/admin.js"></script>
    <script>function toggleSidebar(){document.getElementById('adminSidebar').classList.toggle('open');}</script>
</body>
</html>
