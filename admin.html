<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم الادمن</title>
<style>:root{--bg:#050505;--gold:#D4AF37;--cyan:#00f2ff}body{margin:0;background:var(--bg);color:#eee;font-family:Tahoma}#header{position:fixed;top:0;left:0;right:0;z-index:1000}#main{padding-top:110px;max-width:900px;margin:auto;padding:20px}input,select,textarea{width:100%;padding:12px;margin:8px 0;background:rgba(0,0,0,.5);border:1px solid rgba(212,175,55,.3);border-radius:10px;color:#eee}button{padding:12px 20px;background:var(--gold);color:#000;border:0;border-radius:10px;cursor:pointer;font-weight:600}</style>
</head>
<body>
<div id="header"></div>
<main id="main">
  <h1 style="color:var(--gold);font-weight:300">نشر مقالة جديدة</h1>
  <form id="pubForm">
    <input id="title" placeholder="العنوان" required>
    <select id="category"><option>هندسة السرد</option><option>عمارة الاستثمار</option><option>الأنظمة الذكية</option><option>البيانات</option></select>
    <textarea id="content" rows="8" placeholder="المحتوى..." required></textarea>
    <input type="file" id="image" accept="image/*">
    <img id="preview" style="max-width:200px;display:none;margin:10px 0;border-radius:8px">
    <button type="submit">نشر الآن</button>
  </form>
  <h2 style="margin-top40px;color:var(--cyan)">المقالات المنشورة</h2>
  <div id="list"></div>
</main>
<script>
fetch('header.html').then(r=>r.text()).then(h=>document.getElementById('header').innerHTML=h);

const imgInput=document.getElementById('image'),preview=document.getElementById('preview');
let imgData='';
imgInput.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imgData=r.result;preview.src=imgData;preview.style.display='block'};r.readAsDataURL(f)};

document.getElementById('pubForm').onsubmit=e=>{
  e.preventDefault();
  const art={id:Date.now(),title:title.value,category:category.value,content:content.value,image:imgData,date:new Date().toISOString()};
  const arts=JSON.parse(localStorage.getItem('alshanfricc_articles')||'[]');arts.push(art);localStorage.setItem('alshanfricc_articles',JSON.stringify(arts));
  generateFile(art);
  e.target.reset();preview.style.display='none';imgData='';renderList();alert('تم النشر!');
};

function generateFile(a){
  const html=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${a.title}</title><style>body{margin:0;background:#050505;color:#eee;font-family:Tahoma;padding:40px;max-width:800px;margin:auto}h1{color:#D4AF37}img{max-width:100%;border-radius:12px;margin:20px 0}.meta{color:#00f2ff}</style></head><body><a href="index.html" style="color:#D4AF37">← العودة</a><h1>${a.title}</h1><div class="meta">${a.category} • ${new Date(a.date).toLocaleDateString('ar')}</div>${a.image?`<img src="${a.image}">`:''}<div style="line-height:1.8">${a.content.replace(/\n/g,'<br>')}</div></body></html>`;
  const blob=new Blob([html],{type:'text/html'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`article-${a.id}.html`;link.click();
}

function renderList(){
  const arts=JSON.parse(localStorage.getItem('alshanfricc_articles')||'[]').reverse();
  document.getElementById('list').innerHTML=arts.map(a=>`<div style="background:rgba(255,255,255,.05);padding:12px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center"><span>${a.title}</span><div><button onclick="downloadAgain('${a.id}')" style="background:var(--cyan);margin-left:6px">تحميل</button><button onclick="del('${a.id}')" style="background:#900;color:#fff">حذف</button></div></div>`).join('');
}
function del(id){let arts=JSON.parse(localStorage.getItem('alshanfricc_articles')||'[]');arts=arts.filter(a=>a.id!=id);localStorage.setItem('alshanfricc_articles',JSON.stringify(arts));renderList()}
function downloadAgain(id){const a=JSON.parse(localStorage.getItem('alshanfricc_articles')||'[]').find(x=>x.id==id);generateFile(a)}
renderList();
</script>
</body>
</html>
