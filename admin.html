<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>الأدمن</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{background:#000;color:#eee;font-family:'Tajawal',Tahoma;padding:20px;max-width:1000px;margin:auto}input,textarea,select{width:100%;padding:10px;margin:6px 0;background:#111;color:#eee;border:1px solid #D4AF37;border-radius:6px}button{padding:10px 15px;background:#D4AF37;color:#000;border:0;border-radius:6px;cursor:pointer;margin:4px;font-weight:bold}.box{background:#111;padding:20px;margin:15px 0;border-radius:10px;border:1px solid #222}h2{color:#D4AF37;margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.danger{background:#ff4444;color:#fff}</style></head><body>
<script>if(sessionStorage.adminAuth!=='1'){location.href='index.html'}</script>
<h1 style="color:#D4AF37;text-align:center">لوحة تحكم ALSHANFRICC 🔐</h1>

<div class="box"><h2>1- النشر الذكي</h2><input id="tag" placeholder="الوسم"><input id="title" placeholder="العنوان"><textarea id="content" rows="8" placeholder="المحتوى - استخدم ## للعناوين"></textarea><button onclick="genTOC()">🤖 توليد فهرس</button><button onclick="viral()">🔥 عناوين فيروسية</button><button onclick="publish()">📤 نشر</button><div id="aiOut" style="margin-top:10px;color:#0ff"></div></div>

<div class="box"><h2>2- ترند السعودية</h2><button onclick="getTrend()">جلب الترند الآن</button><div id="trend" style="margin-top:10px"></div></div>

<div class="box"><h2>3- صانع فيديو ريلز</h2><input id="vTitle" placeholder="عنوان الفيديو"><button onclick="alert('الفيديو يُصنع في المتصفح ويرسل لتلجرام - يتطلب ربط البوت')">🎬 صنع فيديو</button></div>

<div class="box"><h2>4- إدارة المجالات</h2><div id="cats"></div><input id="newCat" placeholder="مجال جديد"><button onclick="addCat()">إضافة</button></div>

<div class="box"><h2>5- المكتبات</h2><div id="libs"></div><input id="libUrl" placeholder="رابط CDN"><button onclick="addLib()">إضافة مكتبة</button></div>

<div class="box"><h2>6- الخطوط الذهبية</h2><div class="grid" id="fonts"></div><button onclick="randomFont()">🎲 خط عشوائي</button></div>

<div class="box"><h2>7- التحليل</h2><button onclick="showStats()">عرض</button><button onclick="exportExcel()">تصدير Excel</button><div id="stats"></div></div>

<div class="box"><h2>8- الأمان</h2><input id="newEmail" placeholder="بريد جديد"><input id="newPass" type="password" placeholder="كلمة سر جديدة"><button onclick="changePass()">تغيير بيانات الدخول</button><button class="danger" onclick="logout()">تسجيل خروج</button></div>

<div style="text-align:center"><a href="index.html" style="color:#D4AF37">← العودة للموقع</a></div>

<script>
// 1- نشر
async function genTOC(){if(!content.value)return;aiOut.textContent='...';const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+(localStorage.aiKey||''),'Content-Type':'application/json'},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:'قسم النص بعناوين ##:\n'+content.value}]})});const j=await r.json();content.value=j.choices?.[0]?.message?.content||content.value;aiOut.textContent='تم'}
async function viral(){const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+(localStorage.aiKey||''),'Content-Type':'application/json'},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:'5 عناوين فيروسية لـ:'+title.value}]})});const j=await r.json();aiOut.innerHTML=(j.choices?.[0]?.message?.content||'').replace(/\n/g,'<br>')}
function publish(){const arts=JSON.parse(localStorage.alshanfricc_articles||'[]');arts.unshift({id:Date.now(),title:title.value,content:content.value,tags:tag.value||'الرئيسية',date:new Date().toISOString(),views:0});localStorage.alshanfricc_articles=JSON.stringify(arts);alert('تم النشر');title.value='';content.value=''}

// 2- ترند
async function getTrend(){const r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://trends.google.com/trends/trendingsearches/daily/rss?geo=SA'));const j=await r.json();const x=new DOMParser().parseFromString(j.contents,'text/xml');document.getElementById('trend').innerHTML=[...x.querySelectorAll('item title')].slice(0,10).map(t=>`<div>🔥 ${t.textContent}</div>`).join('')}

// 4- مجالات
function loadCats(){const c=JSON.parse(localStorage.cats||'[]');document.getElementById('cats').innerHTML=c.map((x,i)=>`<div>${x.name} <button onclick="delCat(${i})" class="danger" style="padding:2px 6px">x</button></div>`).join('')}function addCat(){const c=JSON.parse(localStorage.cats||'[]');c.push({name:newCat.value,subs:[]});localStorage.cats=JSON.stringify(c);loadCats()}function delCat(i){const c=JSON.parse(localStorage.cats||'[]');c.splice(i,1);localStorage.cats=JSON.stringify(c);loadCats()}loadCats();

// 5- مكتبات
function loadLibs(){const l=JSON.parse(localStorage.siteLibs||'[]');document.getElementById('libs').innerHTML=l.map(x=>`<div>• ${x.name||x.url}</div>`).join('')||'لا مكتبات'}function addLib(){const l=JSON.parse(localStorage.siteLibs||'[]');l.push({url:libUrl.value,name:libUrl.value.split('/').pop(),type:'js',enabled:true});localStorage.siteLibs=JSON.stringify(l);loadLibs()}loadLibs();

// 6- خطوط
const fonts=['Cairo','Tajawal','Amiri','Changa','El Messiri','Cinzel','Noto Kufi Arabic','Almarai','IBM Plex Sans Arabic','Aref Ruqaa','Lateef','Scheherazade New'];document.getElementById('fonts').innerHTML=fonts.map(f=>`<div onclick="setFont('${f}')" style="background:#222;padding:12px;text-align:center;cursor:pointer;border-radius:6px">${f}</div>`).join('');function setFont(f){localStorage.siteStyle=JSON.stringify({...JSON.parse(localStorage.siteStyle||'{}'),font:f});alert('تم: '+f)}function randomFont(){setFont(fonts[Math.floor(Math.random()*fonts.length)])}

// 7- تحليل
function showStats(){const a=JSON.parse(localStorage.alshanfricc_articles||'[]');document.getElementById('stats').innerHTML=`المقالات: ${a.length}<br>المشاهدات: ${a.reduce((s,x)=>s+(x.views||0),0)}`}function exportExcel(){const a=JSON.parse(localStorage.alshanfricc_articles||'[]');const ws=XLSX.utils.json_to_sheet(a.map(x=>({العنوان:x.title,الوسم:x.tags,المشاهدات:x.views||0})));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'data');XLSX.writeFile(wb,'stats.xlsx')}

// 8- أمان
function changePass(){if(newEmail.value) localStorage.adminEmail=newEmail.value;if(newPass.value) localStorage.adminPass=newPass.value;alert('تم التغيير')}function logout(){sessionStorage.removeItem('adminAuth');location.href='index.html'}
</script></body></html>
