<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --cyan: #00f2ff; --black: #050505; }
        body { background: transparent; margin: 0; font-family: 'Segoe UI', sans-serif; color: var(--gold); overflow: visible; }

        .header-container { display: flex; flex-direction: column; align-items: center; padding: 20px; }

        /* الأنظمة الثلاثة */
        .system-node { position: relative; margin-bottom: 60px; width: 100%; display: flex; align-items: center; justify-content: center; }

        /* الدائرة الأساسية */
        .core-circle {
            width: 80px; height: 80px;
            border: 2px solid #222; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(10,10,10,0.9); cursor: pointer;
            position: relative; transition: 0.5s; z-index: 10;
        }
        .core-circle i { font-size: 1.5em; transition: 0.3s; }

        /* تأثير الكهرباء الدائري */
        .core-circle::before {
            content: ''; position: absolute; inset: -5px;
            border: 2px solid transparent; border-radius: 50%;
            transition: 0.5s;
        }

        .system-node:hover .core-circle { border-color: var(--gold); box-shadow: 0 0 20px rgba(212,175,55,0.3); }
        .system-node:hover .core-circle::before { border-top-color: var(--gold); border-bottom-color: var(--gold); animation: rotate 2s linear infinite; }

        /* المستطيل المنحني (الشاشة الجانبية) */
        .side-panel {
            position: absolute; right: 55%; 
            width: 0; height: 100px; 
            background: rgba(212,175,55,0.03);
            border: 1px solid rgba(212,175,55,0.1);
            border-radius: 15px; opacity: 0;
            overflow: hidden; transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; padding: 0;
            backdrop-filter: blur(5px);
        }

        .system-node:hover .side-panel { width: 280px; opacity: 1; right: 60%; padding: 0 20px; border-color: var(--gold); }

        /* خط التيار الكهربائي */
        .power-line {
            position: absolute; right: 50%; width: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold));
            transition: 0.4s; z-index: 5;
        }
        .system-node:hover .power-line { width: 10%; box-shadow: 0 0 10px var(--gold); }

        /* أيقونات التواصل والمستطيلات */
        .link-item { color: var(--gold); text-decoration: none; font-size: 0.8em; margin: 0 10px; opacity: 0; transition: 0.5s; white-space: nowrap; }
        .system-node:hover .link-item { opacity: 1; animation: glowPulse 2s infinite; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes glowPulse { 0%, 100% { text-shadow: 0 0 5px var(--gold); } 50% { text-shadow: 0 0 15px var(--gold); color: #fff; } }

    </style>
</head>
<body>

<div class="header-container">
    
    <div class="system-node">
        <div class="core-circle"><i class="fas fa-sitemap"></i></div>
        <div class="power-line"></div>
        <div class="side-panel">
            <a href="#" class="link-item">[ هندسة السرد ]</a>
            <a href="#" class="link-item">[ عمارة الاستثمار ]</a>
            <a href="#" class="link-item">[ الأتمتة ]</a>
        </div>
    </div>

    <div class="system-node">
        <div class="core-circle"><i class="fas fa-bolt"></i></div>
        <div class="power-line"></div>
        <div class="side-panel">
            <a href="#" class="link-item"><i class="fab fa-x-twitter"></i></a>
            <a href="#" class="link-item"><i class="fab fa-telegram"></i></a>
            <a href="#" class="link-item"><i class="fab fa-linkedin"></i></a>
            <a href="#" class="link-item"><i class="fab fa-facebook"></i></a>
        </div>
    </div>

    <div class="system-node">
        <div class="core-circle"><i class="fas fa-search"></i></div>
        <div class="power-line"></div>
        <div class="side-panel">
            <input type="text" placeholder="ابحث في السجلات..." style="background:transparent; border:none; border-bottom:1px solid var(--gold); color:var(--gold); outline:none; width:100%; font-size:0.8em;">
        </div>
    </div>

</div>

</body>
</html>
