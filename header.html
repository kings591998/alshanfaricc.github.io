<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    body { background: transparent; margin: 0; text-align: center; font-family: sans-serif; overflow: hidden; }
    .logo { color: #D4AF37; font-size: 3em; letter-spacing: 15px; font-weight: bold; margin-top: 50px; text-transform: uppercase; transition: 1s; }
    .social-icons { display: flex; justify-content: center; gap: 20px; margin: 25px 0; }
    .social-icons a { color: #D4AF37; border: 1px solid #D4AF37; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 50%; text-decoration: none; transition: 0.3s; }
    .social-icons a:hover { background: #D4AF37; color: #000; box-shadow: 0 0 15px #D4AF37; }
    #geo-status { color: #D4AF37; font-size: 0.6em; letter-spacing: 3px; opacity: 0.5; }
</style>

<div class="logo">ALSHANFRICC</div>
<div id="geo-status">INITIALIZING TRACKER...</div>

<div class="social-icons">
    <a href="#"><i class="fab fa-x-twitter"></i></a>
    <a href="#"><i class="fab fa-telegram-plane"></i></a>
    <a href="#"><i class="fab fa-whatsapp"></i></a>
    <a href="#"><i class="fab fa-linkedin-in"></i></a>
</div>

<script>
    // حيلة 5: الانعكاس الزمني للهيدر
    const hour = new Date().getHours();
    if (hour >= 18 || hour < 6) document.querySelector('.logo').style.color = "#E5E4E2";

    // حيلة 3: الترحيب الجغرافي
    fetch('https://ipapi.co/json/').then(res => res.json()).then(data => {
        document.getElementById('geo-status').innerText = `GREETINGS FROM ${data.city || "THE HORIZON"}`;
    });
</script>
