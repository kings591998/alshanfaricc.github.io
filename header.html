<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --cyan: #00f2ff; }
        body { background: transparent; margin: 0; padding: 10px 15px; font-family: sans-serif; overflow: visible; box-sizing: border-box; }

        .nav-grid {
            display: flex;
            justify-content: space-between; /* الاسم يسار والأيقونات يمين */
            align-items: center;
            width: 100%;
        }

        /* الاسم أقصى اليسار بحجم أنيق */
        .brand-left h1 { 
            font-size: 1.1rem; 
            color: var(--gold); 
            letter-spacing: 2px; 
            margin: 0; 
            font-weight: 900;
            white-space: nowrap;
        }

        /* مجموعة الأيقونات أقصى اليمين */
        .controls-right {
            display: flex;
            flex-direction: row-reverse; /* ترتيب الأيقونات من اليمين لليسار */
            gap: 10px;
        }

        .node-wrapper { position: relative; }

        .btn-ui {
            width: 38px; height: 38px;
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 50%;
            background: rgba(0,0,0,0.85);
            color: var(--gold);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            font-size: 0.8rem;
        }

        .btn-ui:hover { 
            border-color: var(--gold); 
            box-shadow: 0 0 10px var(--gold);
            transform: scale(1.1);
        }

        /* القائمة المنسدلة للأسفل */
        .dropdown-box {
            position: absolute;
            top: 45px;
            right: 0;
            width: 140px;
            background: rgba(10,10,10,0.98);
            border: 1px solid var(--gold);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            padding: 5px;
            z-index: 5000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.7);
        }

        .node-wrapper:hover .dropdown-box { display: flex; animation: dropAnim 0.3s ease; }

        .menu-item {
            color: var(--gold);
            text-decoration: none;
            font-size: 10px;
            padding: 10px;
            border-bottom: 1px solid rgba(212,175,55,0.05);
            transition: 0.2s;
        }
        .menu-item:hover { background: rgba(212,175,55,0.1); color: #fff; }

        @keyframes dropAnim { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .search-inner {
            background: transparent; border: none; border-bottom: 1px solid var(--gold);
            color: var(--gold); width: 100%; outline: none; font-size: 10px; padding: 5px;
        }
    </style>
</head>
<body>

<div class="nav-grid">
    
    <div class="brand-left">
        <h1>ALSHANFRICC</h1>
    </div>

    <div class="controls-right">
        
        <div class="node-wrapper">
            <div class="btn-ui" onclick="window.history.back()"><i class="fas fa-arrow-right"></i></div>
        </div>

        <div class="node-wrapper">
            <div class="btn-ui" onclick="parent.document.body.classList.toggle('light-theme')">
                <i class="fas fa-sun"></i>
            </div>
        </div>

        <div class="node-wrapper">
            <div class="btn-ui"><i class="fas fa-th-large"></i></div>
            <div class="dropdown-box">
                <a href="#" class="menu-item"><i class="fas fa-pen"></i> هندسة السرد</a>
                <a href="#" class="menu-item"><i class="fas fa-chart-pie"></i> عمارة الاستثمار</a>
                <a href="#" class="menu-item"><i class="fas fa-code"></i> الأنظمة الذكية</a>
                <a href="#" class="menu-item"><i class="fas fa-server"></i> البيانات</a>
            </div>
        </div>

        <div class="node-wrapper">
            <div class="btn-ui" style="color:var(--cyan);"><i class="fas fa-paper-plane"></i></div>
            <div class="dropdown-box">
                <a href="#" class="menu-item"><i class="fab fa-telegram"></i> Telegram</a>
                <a href="#" class="menu-item"><i class="fab fa-linkedin"></i> LinkedIn</a>
            </div>
        </div>

        <div class="node-wrapper">
            <div class="btn-ui"><i class="fas fa-search"></i></div>
            <div class="dropdown-box" style="width: 180px;">
                <input type="text" class="search-inner" placeholder="ابحث في النواة السيادية...">
            </div>
        </div>

    </div>
</div>

</body>
</html>
