<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    :root { --gold: #D4AF37; --black: #050505; --silver: #E5E4E2; }
    body { background: transparent; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: var(--gold); }

    /* 1. شريط الحالة العلوي (Metadata) */
    .status-bar { 
        width: 100%; height: 25px; 
        border-bottom: 1px solid rgba(212,175,55,0.1); 
        display: flex; justify-content: space-between; align-items: center; 
        padding: 0 20px; font-size: 0.52em; letter-spacing: 2px; 
        text-transform: uppercase; opacity: 0.6; 
    }

    .header-main { text-align: center; padding-top: 30px; position: relative; }

    /* 2. الشعار المتنفس مع تأثير البارالاكس */
    .logo { 
        font-size: 3.8em; 
        letter-spacing: 18px; 
        font-weight: 900; 
        text-transform: uppercase; 
        margin: 0;
        transition: 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        animation: logoBreathing 5s infinite ease-in-out;
        cursor: pointer;
    }

    @keyframes logoBreathing {
        0%, 100% { text-shadow: 0 0 10px rgba(212,175,55,0.1); filter: brightness(1); }
        50% { text-shadow: 0 0 25px rgba(212,175,55,0.4); filter: brightness(1.2); }
    }

    .subtitle { font-size: 0.55em; letter-spacing: 6px; opacity: 0.4; margin-top: 5px; font-weight: 300; }

    /* 3. تبويبات الملاحة السيادية */
    .nav-vault { 
        display: flex; justify-content: center; gap: 40px; 
        margin-top: 25px; padding: 10px 0;
        border-top: 1px solid rgba(212,175,55,0.05);
        border-bottom: 1px solid rgba(212,175,55,0.05);
    }
    .nav-item { 
        color: var(--gold); text-decoration: none; 
        font-size: 0.65em; letter-spacing: 3px; font-weight: bold;
        transition: 0.4s; opacity: 0.7; position: relative;
    }
    .nav-item:hover { opacity: 1; letter-spacing: 5px; text-shadow: 0 0 10px var(--gold); }
    .nav-item::before { content: '['; margin-right: 5px; opacity: 0; transition: 0.3s; }
    .nav-item::after { content: ']'; margin-left: 5px; opacity: 0; transition: 0.3s; }
    .nav-item:hover::before, .nav-item:hover::after { opacity: 1; }

    /* 4. أيقونات التواصل */
    .social-dock { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
    .social-dock a { 
        color: var(--gold); text-decoration: none; font-size: 0.75em; 
        width: 30px; height: 30px; border: 1px solid rgba(212,175,55,0.2); 
        border-radius: 50%; display: flex; align-items: center; justify-content: center; 
        transition: 0.4s; opacity: 0.6;
    }
    .social-dock a:hover { opacity: 1; border-color: var(--gold); transform: scale(1.1); box-shadow: 0 0 10px var(--gold); }

</style>

<div class="status-bar">
    <div id="time-jubail">JUBAIL TIME: --:--:--</div>
    <div id="coordinates">ARCHITECT LOC: 27.0117° N, 49.6583° E</div>
    <div id="active-status">SYSTEM STATUS: <span style="color:#00ff00;">SOVEREIGN</span></div>
</div>

<div class="header-main">
    <h1 class="logo" id="main-logo" onclick="window.parent.location.reload()">ALSHANFRICC</h1>
    <div class="subtitle">NARRATIVE ENGINEERING & INVESTMENT ARCHITECTURE</div>
    
    <nav class="nav-vault">
        <a href="info.html" target="_top" class="nav-item">ABOUT</a>
        <a href="info.html" target="_top" class="nav-item">SERVICES</a>
        <a href="info.html" target="_top" class="nav-item">PRIVACY</a>
        <a href="info.html" target="_top" class="nav-item" style="color:var(--silver);">GATE</a>
    </nav>

    <div class="social-dock">
        <a href="#"><i class="fab fa-x-twitter"></i></a>
        <a href="#"><i class="fab fa-telegram-plane"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
    </div>
</div>

<script>
    // تحديث الوقت لحظياً
    function updateClock() {
        const opt = { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        document.getElementById('time-jubail').innerText = `JUBAIL TIME: ${new Intl.DateTimeFormat('en-GB', opt).format(new Date())}`;
    }
    setInterval(updateClock, 1000);

    // حيلة التعرف على العائد (L5)
    let visits = localStorage.getItem('alshanfric_visits') || 0;
    visits++;
    localStorage.setItem('alshanfric_visits', visits);
    if(visits > 3) document.querySelector('.subtitle').innerText = "WELCOME BACK, ARCHITECT | SESSION ACTIVE";

    // حيلة الجيروسكوب للجوال (L5)
    if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
            const tiltX = e.gamma / 3;
            const tiltY = e.beta / 3;
            document.getElementById('main-logo').style.transform = `rotateY(${tiltX}deg) rotateX(${tiltY}deg)`;
        });
    }

    // حيلة الانعكاس الزمني (ذهبي نهاراً، فضي ليلاً)
    const h = new Date().getHours();
    if (h >= 18 || h < 6) {
        document.getElementById('main-logo').style.color = "var(--silver)";
    }
</script>
