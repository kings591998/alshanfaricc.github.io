<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --cyan: #00f2ff; }
        body { background: transparent; margin: 0; padding: 10px 20px; font-family: sans-serif; overflow: visible; }

        .nav-master {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* الاسم بحجم أصغر لتجنب التداخل */
        .brand-small { text-align: left; }
        .brand-small h1 { 
            font-size: 1.2rem; 
            color: var(--gold); 
            letter-spacing: 2px; 
            margin: 0; 
            font-weight: 900;
        }

        /* حاوية الأيقونات أفقية مرتبة */
        .controls-tray {
            display: flex;
            gap: 12px;
        }

        .action-node { position: relative; }

        .btn-circle {
            width: 40px; height: 40px;
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 50%;
            background: rgba(0,0,0,0.8);
            color: var(--gold);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            font-size: 0.9rem;
        }

        .btn-circle:hover { 
            border-color: var(--gold); 
            box-shadow: 0 0 10px var(--gold);
            transform: scale(1.1);
        }

        /* القوائم المنسدلة */
        .mega-menu {
            position: absolute;
            top: 50px; left: 0;
            width: 150px;
            background: rgba(10,10,10,0.95);
            border: 1px solid var(--gold);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            padding: 5px;
            z-index: 2000;
        }

        .action-node:hover .mega-menu { display: flex; animation: slideIn 0.3s ease; }

        .menu-link {
            color: var(--gold);
            text-decoration: none;
            font-size: 10px;
            padding: 8px;
            border-bottom: 1px solid rgba(212,175,55,0.05);
        }
        .menu-link:hover { background: rgba(212,175,55,0.1); color: #fff; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .search-input {
            background: transparent; border: none; border-bottom: 1px solid var(--gold);
            color: var(--gold); width: 100%; outline: none; font-size: 10px;
        }
    </style>
</head>
<body>

<div class="nav-master">
    
    <div class="brand-small">
        <h1>ALSHANFRICC</h1>
    </div>

    <div class="controls-tray">
        
        <div class="action-node">
            <div class="btn-circle" onclick="window.history.back()"><i class="fas fa-chevron-right"></i></div>
        </div>

        <div class="action-node">
            <div class="btn-circle" onclick="parent.document.body.classList.toggle('light-mode')">
                <i class="fas fa-lightbulb"></i>
            </div>
        </div>

        <div class="action-node">
            <div class="btn-circle"><i class="fas fa-sitemap"></i></div>
            <div class="mega-menu">
                <a href="#" class="menu-link">هندسة السرد</a>
                <a href="#" class="menu-link">الاستثمار</a>
                <a href="#" class="menu-link">الأتمتة</a>
            </div>
        </div>

        <div class="action-node">
            <div class="btn-circle" style="color:var(--cyan);"><i class="fas fa-bolt"></i></div>
            <div class="mega-menu">
                <a href="#" class="menu-link">Telegram</a>
                <a href="#" class="menu-link">X-Twitter</a>
            </div>
        </div>

        <div class="action-node">
            <div class="btn-circle"><i class="fas fa-search"></i></div>
            <div class="mega-menu" style="width: 200px;">
                <input type="text" class="search-input" placeholder="ابحث في النواة...">
            </div>
        </div>

    </div>
</div>

</body>
</html>
