</html<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --silver: #C0C0C0; }
        body { background: transparent; margin: 0; font-family: sans-serif; overflow: visible; display: flex; flex-direction: column; align-items: center; }

        /* شريط الحالة العلوي */
        .status { width: 100%; display: flex; justify-content: space-between; padding: 10px 20px; font-size: 9px; color: var(--gold); opacity: 0.6; box-sizing: border-box; border-bottom: 1px solid rgba(212,175,55,0.1); }

        .header-content { padding: 40px 0; text-align: center; width: 100%; }
        .logo { font-size: 2.5em; letter-spacing: 10px; color: var(--gold); margin-bottom: 50px; font-weight: 900; }

        /* حاوية الأنظمة الثلاثة */
        .systems-wrapper { display: flex; flex-direction: column; gap: 40px; align-items: center; width: 100%; }

        .system-node { position: relative; display: flex; align-items: center; width: 300px; justify-content: center; }

        /* الأيقونة الدائرية */
        .core-icon {
            width: 60px; height: 60px; border: 2px solid #333; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #000; color: var(--gold); cursor: pointer;
            z-index: 10; transition: 0.4s; position: relative;
        }
        
        /* توهج الحافة (الكهرباء) */
        .system-node:hover .core-icon { 
            border-color: var(--gold); 
            box-shadow: 0 0 15px var(--gold), inset 0 0 10px var(--gold);
        }

        /* المستطيل المنحني والخط الكهربائي */
        .panel {
            position: absolute; right: 60px;
            height: 50px; width: 0; opacity: 0;
            background: rgba(10,10,10,0.95);
            border: 1px solid var(--gold);
            border-radius: 10px;
            display: flex; align-items: center; gap: 15px;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0; overflow: hidden;
            box-shadow: -5px 0 15px rgba(212,175,55,0.2);
        }

        /* سريان التيار */
        .system-node:hover .panel { width: 220px; opacity: 1; padding: 0 15px; right: 80px; }

        /* أيقونات التواصل والتبويبات داخل المستطيلات */
        .item { color: var(--gold); text-decoration: none; font-size: 14px; white-space: nowrap; transition: 0.3s; }
        .item:hover { color: #fff; text-shadow: 0 0 8px #fff; transform: scale(1.1); }
        
        .social-icons { display: flex; gap: 12px; }
        .social-icons i { font-size: 18px; }

    </style>
</head>
<body>

<div class="status">
    <div id="time">JUBAIL: --:--:--</div>
    <div>27.0117° N, 49.6583° E</div>
</div>

<div class="header-content">
    <div class="logo">ALSHANFRICC</div>

    <div class="systems-wrapper">
        
        <div class="system-node">
            <div class="panel">
                <a href="#" class="item">هندسة السرد</a>
                <a href="#" class="item">الاستثمار</a>
                <a href="#" class="item">الأتمتة</a>
            </div>
            <div class="core-icon"><i class="fas fa-sitemap"></i></div>
        </div>

        <div class="system-node">
            <div class="panel">
                <div class="social-icons">
                    <a href="#" class="item"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="item"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#" class="item"><i class="fab fa-telegram-plane"></i></a>
                    <a href="#" class="item"><i class="fab fa-x-twitter"></i></a>
                </div>
            </div>
            <div class="core-icon"><i class="fas fa-bolt"></i></div>
        </div>

        <div class="system-node">
            <div class="panel">
                <input type="text" placeholder="ابحث هنا..." style="background:transparent; border:none; border-bottom:1px solid var(--gold); color:var(--gold); width:100%; outline:none; font-size:12px;">
            </div>
            <div class="core-icon"><i class="fas fa-search"></i></div>
        </div>

    </div>
</div>

<script>
    function updateClock() {
        const opt = { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        document.getElementById('time').innerText = `JUBAIL: ${new Intl.DateTimeFormat('en-GB', opt).format(new Date())}`;
    }
    setInterval(updateClock, 1000);
</script>
</body>
</html>
