<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --cyan: #00f2ff; }
        body { background: transparent; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: visible; }

        /* الحاوية الرئيسية للهيدر */
        .master-nav {
            display: flex;
            flex-direction: row-reverse; /* الأيقونات يمين والاسم يسارها */
            justify-content: flex-start; 
            align-items: center;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* عمود الأيقونات (أقصى اليمين) */
        .icon-system {
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100; /* لضمان ظهور القوائم فوق أي شيء آخر */
        }

        /* قسم الاسم (بجانب الأيقونات من اليسار) */
        .brand-identity {
            margin-right: 25px; /* مسافة أمان لمنع التغطية */
            text-align: right;
            flex-grow: 1;
        }
        .main-title { 
            font-size: clamp(1.4em, 5vw, 2.5em); 
            color: var(--gold); 
            letter-spacing: 4px; 
            font-weight: 900; 
            margin: 0;
            white-space: nowrap;
        }
        .status-text { font-size: 8px; color: var(--gold); opacity: 0.5; letter-spacing: 2px; }

        .node-group { position: relative; display: flex; align-items: center; }

        /* الأيقونة الدائرية */
        .trigger-btn {
            width: 48px; height: 48px;
            border: 1px solid #333; border-radius: 50%;
            background: #000; color: var(--gold);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .node-group:hover .trigger-btn {
            border-color: var(--gold);
            box-shadow: 0 0 15px var(--gold);
        }

        /* القائمة التي تخرج لليسار */
        .expandable-panel {
            position: absolute;
            right: 55px; /* تبدأ من طرف الأيقونة */
            height: 44px;
            width: 0;
            opacity: 0;
            background: rgba(5,5,5,0.95);
            border: 1px solid var(--gold);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0;
            overflow: hidden;
            transition: 0.4s ease-out;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }

        .node-group:hover .expandable-panel {
            width: 280px; /* عرض القائمة */
            opacity: 1;
            padding: 0 15px;
            box-shadow: -10px 0 20px rgba(0,0,0,0.8);
        }

        .link-branch {
            color: var(--gold);
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            margin-left: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .link-branch:hover { color: #fff; }

        /* البحث */
        .search-inner {
            background: transparent; border: none; border-bottom: 1px solid var(--gold);
            color: var(--gold); width: 100%; outline: none; font-size: 12px;
        }

        @media (max-width: 480px) {
            .main-title { font-size: 1.2em; letter-spacing: 2px; }
            .node-group:hover .expandable-panel { width: 220px; }
        }
    </style>
</head>
<body>

<div class="master-nav">
    
    <div class="icon-system">
        
        <div class="node-group">
            <div class="expandable-panel">
                <a href="#" class="link-branch"><i class="fas fa-pen-nib"></i> السرد</a>
                <a href="#" class="link-branch"><i class="fas fa-chart-line"></i> الاستثمار</a>
                <a href="#" class="link-branch"><i class="fas fa-robot"></i> الأتمتة</a>
            </div>
            <div class="trigger-btn"><i class="fas fa-sitemap"></i></div>
        </div>

        <div class="node-group">
            <div class="expandable-panel">
                <a href="#" class="link-branch"><i class="fab fa-telegram"></i> Telegram</a>
                <a href="#" class="link-branch"><i class="fab fa-linkedin"></i> LinkedIn</a>
                <a href="#" class="link-branch"><i class="fab fa-x-twitter"></i> Twitter</a>
            </div>
            <div class="trigger-btn" style="color:var(--cyan); border-color: rgba(0,242,255,0.3);"><i class="fas fa-bolt"></i></div>
        </div>

        <div class="node-group">
            <div class="expandable-panel">
                <input type="text" class="search-inner" placeholder="ابحث في النواة...">
            </div>
            <div class="trigger-btn"><i class="fas fa-search"></i></div>
        </div>

    </div>

    <div class="brand-identity">
        <h1 class="main-title">ALSHANFRICC</h1>
        <div class="status-text">SYSTEM ACTIVE | JUBAIL HUB</div>
    </div>

</div>

</body>
</html>
