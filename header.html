<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    body { background: transparent; margin: 0; text-align: center; font-family: sans-serif; }
    .logo { color: #D4AF37; font-size: 3.5em; letter-spacing: 15px; font-weight: bold; margin-top: 60px; text-transform: uppercase; transition: 2s; }
    #geo { color: #D4AF37; font-size: 0.6em; letter-spacing: 5px; opacity: 0.5; margin-top: 15px; }
    .socials { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
    .socials a { color: #D4AF37; border: 1px solid rgba(212,175,55,0.4); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 0.9em; transition: 0.3s; }
    .socials a:hover { background: #D4AF37; color: #000; box-shadow: 0 0 15px #D4AF37; }
</style>

<div class="logo">ALSHANFRICC</div>
<div id="geo">ACCESSING JAZAN...</div> <div class="socials">
    <a href="#"><i class="fab fa-x-twitter"></i></a>
    <a href="#"><i class="fab fa-telegram"></i></a>
    <a href="#"><i class="fab fa-whatsapp"></i></a>
    <a href="#"><i class="fab fa-linkedin-in"></i></a>
</div>

<script>
    // حيلة L5: الانعكاس الزمني
    if (new Date().getHours() >= 18 || new Date().getHours() < 6) 
        document.querySelector('.logo').style.color = "#E5E4E2";

    // حيلة L4: الترحيب الجغرافي
    fetch('https://ipapi.co/json/').then(r => r.json()).then(d => {
        document.getElementById('geo').innerText = `GREETINGS FROM ${d.city?.toUpperCase() || "THE HORIZON"}`;
    });
</script>
