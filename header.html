<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --cyan: #00f2ff; }
        body { background: transparent; margin: 0; padding: 20px; font-family: sans-serif; overflow: visible; }

        /* حاوية الهيدر الرئيسية */
        .master-header {
            display: flex;
            justify-content: space-between; /* الاسم يسار والأيقونات يمين */
            align-items: flex-start;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* جهة الاسم */
        .brand { text-align: right; margin-top: 10px; }
        .logo { font-size: clamp(1.5em, 5vw, 2.8em); color: var(--gold); letter-spacing: 5px; font-weight: 900; margin: 0; }
        .tagline { font-size: 9px; color: var(--gold); opacity: 0.5; letter-spacing: 2px; }

        /* حاوية الأيقونات الثلاث */
        .actions-tray {
            display: flex;
            gap: 15px; /* أيقونات بجانب بعضها أفقياً على اليمين */
        }

        .node { position: relative; }

        /* الأيقونة الدائرية (الأم) */
        .icon-trigger {
            width: 50px; height: 50px;
            border: 2px solid #222; border-radius: 50%;
            background: #000; color: var(--gold);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.4s;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        /* توهج الحافة عند اللمس */
        .node:hover .icon-trigger {
            border-color: var(--gold);
            box-shadow: 0 0 15px var(--gold);
            transform: scale(1.1);
        }

        /* قائمة الفروع (تظهر تحت الأيقونة مباشرة) */
        .sub-menu {
            position: absolute;
            top: 60px; /* تفتح للأسفل */
            right: 0;
            width: 180px;
            background: rgba(10,10,10,0.95);
            border: 1px solid var(--gold);
            border-radius: 10px;
            padding: 10px;
            display: none; /* مخفية افتراضياً */
            flex-direction: column;
            gap: 12px;
            z-index: 999;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* إظهار القائمة عند التحليق */
        .node:hover .sub-menu { display: flex; animation: slideDown 0.3s ease-out; }

        .branch {
            color: var(--gold);
            text-decoration: none;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .branch:hover { color: #fff; transform: translateX(-5px); }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* أيقونة البحث */
        .search-box {
            background: transparent; border: none; border-bottom: 1px solid var(--gold);
            color: var(--gold); width: 100%; outline: none; font-size: 12px;
        }

        /* للجوال: تقليل المسافات */
        @media (max-width: 600px) {
            .master-header { flex-direction: column-reverse; align-items: flex-end; gap: 20px; }
            .sub-menu { right: auto; left: 0; } /* تفتح لليسار في الجوال لتجنب الخروج عن الشاشة */
        }
    </style>
</head>
<body>

<div class="master-header">
    <div class="brand">
        <h1 class="logo">ALSHANFRICC</h1>
        <div class="tagline">SYSTEM ACTIVE | JUBAIL HUB</div>
    </div>

    <div class="actions-tray">
        
        <div class="node">
            <div class="icon-trigger"><i class="fas fa-sitemap"></i></div>
            <div class="sub-menu">
                <a href="#" class="branch"><i class="fas fa-pen-nib"></i> هندسة السرد</a>
                <a href="#" class="branch"><i class="fas fa-chart-line"></i> عمارة الاستثمار</a>
                <a href="#" class="branch"><i class="fas fa-robot"></i> الأنظمة الذكية</a>
                <a href="#" class="branch"><i class="fas fa-database"></i> البيانات</a>
            </div>
        </div>

        <div class="node">
            <div class="icon-trigger" style="color:var(--cyan);"><i class="fas fa-bolt"></i></div>
            <div class="sub-menu">
                <a href="#" class="branch"><i class="fab fa-telegram"></i> Telegram</a>
                <a href="#" class="branch"><i class="fab fa-linkedin"></i> LinkedIn</a>
                <a href="#" class="branch"><i class="fab fa-x-twitter"></i> X-Twitter</a>
                <a href="#" class="branch"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            </div>
        </div>

        <div class="node">
            <div class="icon-trigger"><i class="fas fa-search"></i></div>
            <div class="sub-menu">
                <input type="text" class="search-box" placeholder="ابحث في النواة...">
            </div>
        </div>

    </div>
</div>

</body>
</html>
