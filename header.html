<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --silver: #E5E4E2; }
        body { 
            background: transparent; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', sans-serif; 
            color: var(--gold); 
            overflow: visible; /* السماح بظهور التبويبات */
        }

        .status-bar { 
            width: 100%; height: 30px; 
            border-bottom: 1px solid rgba(212,175,55,0.1); 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 20px; font-size: 10px; letter-spacing: 2px; opacity: 0.7; 
            box-sizing: border-box;
        }

        .header-main { text-align: center; padding-top: 20px; }

        .logo { 
            font-size: 3em; 
            letter-spacing: 12px; 
            font-weight: 900; 
            text-transform: uppercase; 
            margin: 0; 
            animation: pulse 4s infinite; 
            cursor: pointer;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; text-shadow: 0 0 15px var(--gold); } }

        .subtitle { font-size: 9px; letter-spacing: 5px; opacity: 0.5; margin-bottom: 25px; }

        /* التبويبات - تأكد من هذه القيم */
        .nav-vault { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            margin: 20px auto; 
            padding: 10px 0; 
            border-top: 1px solid rgba(212,175,55,0.2); 
            border-bottom: 1px solid rgba(212,175,55,0.2); 
            max-width: 90%;
        }

        .nav-item { 
            color: var(--gold); 
            text-decoration: none; 
            font-size: 11px; 
            letter-spacing: 2px; 
            font-weight: bold; 
            transition: 0.3s; 
            display: inline-block;
        }

        .nav-item:hover { transform: scale(1.1); color: var(--silver); }

        .social-dock { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .social-dock a { color: var(--gold); font-size: 18px; text-decoration: none; opacity: 0.6; transition: 0.3s; }
        .social-dock a:hover { opacity: 1; transform: translateY(-3px); }
    </style>
</head>
<body>

<div class="status-bar">
    <div id="jubail-time">JUBAIL: --:--:--</div>
    <div>27.0117° N, 49.6583° E</div>
    <div>STATUS: <span style="color:#00ff00;">SOVEREIGN</span></div>
</div>

<div class="header-main">
    <h1 class="logo" id="main-logo" onclick="window.parent.location.reload()">ALSHANFRICC</h1>
    <div class="subtitle">NARRATIVE ENGINEERING & INVESTMENT ARCHITECTURE</div>
    
    <nav class="nav-vault">
        <a href="info.html" target="_top" class="nav-item">مَن نحن</a>
        <a href="info.html" target="_top" class="nav-item">خدماتنا</a>
        <a href="info.html" target="_top" class="nav-item">الخصوصية</a>
        <a href="info.html" target="_top" class="nav-item" style="color:var(--silver);">البوابة</a>
    </nav>

    <div class="social-dock">
        <a href="#"><i class="fab fa-x-twitter"></i></a>
        <a href="#"><i class="fab fa-telegram-plane"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
    </div>
</div>

<script>
    function updateTime() {
        const opt = { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        document.getElementById('jubail-time').innerText = `JUBAIL: ${new Intl.DateTimeFormat('en-GB', opt).format(new Date())}`;
    }
    setInterval(updateTime, 1000);
</script>
</body>
</html>
