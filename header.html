<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --cyan: #00f2ff; }
        body { background: transparent; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: visible; }

        /* حاوية الهيدر: الاسم يسار والأيقونات يمين */
        .nav-wrapper {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 15px 20px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        /* قسم الاسم (أقصى اليسار) */
        .brand-box { text-align: left; order: 1; }
        .logo-text { 
            font-size: clamp(1.2em, 4vw, 2.2em); 
            color: var(--gold); 
            letter-spacing: 3px; 
            font-weight: 900; 
            margin: 0;
        }

        /* عمود الأيقونات (أقصى اليمين) */
        .icon-system { 
            display: flex; 
            gap: 15px; 
            order: 2; 
            position: relative;
        }

        .node-container { position: relative; }

        /* الأيقونة الدائرية */
        .main-trigger {
            width: 45px; height: 45px;
            border: 1px solid rgba(212,175,55,0.3); border-radius: 50%;
            background: rgba(0,0,0,0.9); color: var(--gold);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            z-index: 100;
        }

        .node-container:hover .main-trigger {
            border-color: var(--gold);
            box-shadow: 0 0 15px var(--gold);
            transform: scale(1.1);
        }

        /* القائمة المنسدلة للأسفل (لتجنب تغطية الاسم) */
        .drop-panel {
            position: absolute;
            top: 55px; /* تفتح تحت الأيقونة مباشرة */
            right: 0;
            width: 160px;
            background: rgba(10,10,10,0.98);
            border: 1px solid var(--gold);
            border-radius: 12px;
            display: none; /* تظهر عند Hover فقط */
            flex-direction: column;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 1000;
        }

        .node-container:hover .drop-panel { display: flex; animation: fadeIn 0.3s ease; }

        .sub-link {
            color: var(--gold);
            text-decoration: none;
            font-size: 11px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(212,175,55,0.1);
            transition: 0.3s;
        }
        .sub-link:last-child { border: none; }
        .sub-link:hover { background: rgba(212,175,55,0.1); color: #fff; padding-right: 15px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .search-bar {
            background: transparent; border: none; border-bottom: 1px solid var(--gold);
            color: var(--gold); width: 100%; outline: none; font-size: 11px; padding: 5px 0;
        }
    </style>
</head>
<body>

<div class="nav-wrapper">
    
    <div class="brand-box">
        <h1 class="logo-text">ALSHANFRICC</h1>
    </div>

    <div class="icon-system">
        
        <div class="node-container">
            <div class="main-trigger"><i class="fas fa-sitemap"></i></div>
            <div class="drop-panel">
                <a href="#" class="sub-link"><i class="fas fa-pen-nib"></i> هندسة السرد</a>
                <a href="#" class="sub-link"><i class="fas fa-chart-line"></i> عمارة الاستثمار</a>
                <a href="#" class="sub-link"><i class="fas fa-robot"></i> الأنظمة الذكية</a>
                <a href="#" class="sub-link"><i class="fas fa-database"></i> البيانات</a>
            </div>
        </div>

        <div class="node-container">
            <div class="main-trigger" style="color:var(--cyan);"><i class="fas fa-bolt"></i></div>
            <div class="drop-panel">
                <a href="#" class="sub-link"><i class="fab fa-telegram"></i> Telegram</a>
                <a href="#" class="sub-link"><i class="fab fa-linkedin"></i> LinkedIn</a>
                <a href="#" class="sub-link"><i class="fab fa-x-twitter"></i> Twitter</a>
            </div>
        </div>

        <div class="node-container">
            <div class="main-trigger"><i class="fas fa-search"></i></div>
            <div class="drop-panel">
                <input type="text" class="search-bar" placeholder="ابحث هنا...">
            </div>
        </div>

    </div>
</div>

</body>
</html>
