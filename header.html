<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #050505; }
        body { background: transparent; margin: 0; font-family: 'Segoe UI', sans-serif; color: var(--gold); overflow: visible; }

        /* حاوية الهيدر كاملة */
        .header-wrapper {
            display: flex;
            justify-content: flex-end; /* دفع العناصر لليمين */
            align-items: flex-start;
            padding: 20px 40px;
            position: relative;
        }

        /* قسم الاسم (يسار الأيقونات) */
        .brand-section {
            position: absolute;
            right: 140px; /* المسافة بين الاسم والأيقونات */
            top: 50px;
            text-align: right;
        }
        .logo { font-size: 2.8em; letter-spacing: 8px; font-weight: 900; margin: 0; }
        .subtitle { font-size: 10px; opacity: 0.5; letter-spacing: 3px; }

        /* حاوية الأيقونات الثلاث (على اليمين تماماً) */
        .side-dashboard {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .system-node {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* الأيقونة الدائرية الأم */
        .core-icon {
            width: 55px; height: 55px;
            border: 2px solid #222; border-radius: 50%;
            background: #000; color: var(--gold);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100;
            transition: 0.4s;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .system-node:hover .core-icon {
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold);
            transform: scale(1.1);
        }

        /* شريط الأدوات (يخرج لليسار محاذياً للأيقونة) */
        .tool-bar {
            position: absolute;
            right: 70px; /* يبدأ من جانب الأيقونة ولا يغطيها */
            height: 45px;
            width: 0;
            opacity: 0;
            background: rgba(15,15,15,0.95);
            border-radius: 25px;
            border: 1px solid rgba(212,175,55,0.3);
            display: flex;
            align-items: center;
            padding: 0;
            overflow: hidden;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }

        /* عند المرور: يفتح الشريط بالكامل */
        .system-node:hover .tool-bar {
            width: 380px; /* عرض كافٍ للفروع */
            opacity: 1;
            padding: 0 20px;
            border-color: var(--gold);
            box-shadow: -10px 0 20px rgba(0,0,0,0.5);
        }

        /* أيقونات الفروع والروابط */
        .branch-item {
            color: var(--gold);
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            margin: 0 10px;
            opacity: 0;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .system-node:hover .branch-item { opacity: 1; }
        .branch-item:hover { color: #fff; text-shadow: 0 0 10px var(--gold); }

        /* تأثير "التيار الكهربائي" عند الفتح */
        .tool-bar::before {
            content: ''; position: absolute; left: 0; bottom: 0;
            height: 1px; width: 0; background: var(--gold);
            transition: 0.8s;
        }
        .system-node:hover .tool-bar::before { width: 100%; }

        /* أيقونة البحث */
        .search-input {
            background: transparent; border: none; border-bottom: 1px solid var(--gold);
            color: var(--gold); width: 100%; outline: none; font-size: 12px;
        }
    </style>
</head>
<body>

<div class="header-wrapper">
    
    <div class="brand-section">
        <h1 class="logo">ALSHANFRICC</h1>
        <div class="subtitle">NARRATIVE ENGINEERING & INVESTMENT ARCHITECTURE</div>
    </div>

    <div class="side-dashboard">
        
        <div class="system-node">
            <div class="tool-bar">
                <a href="#" class="branch-item"><i class="fas fa-pen-nib"></i> هندسة السرد</a>
                <a href="#" class="branch-item"><i class="fas fa-chart-line"></i> عمارة الاستثمار</a>
                <a href="#" class="branch-item"><i class="fas fa-robot"></i> الأنظمة الذكية</a>
                <a href="#" class="branch-item"><i class="fas fa-database"></i> البيانات</a>
            </div>
            <div class="core-icon"><i class="fas fa-sitemap"></i></div>
        </div>

        <div class="system-node">
            <div class="tool-bar">
                <a href="#" class="branch-item"><i class="fab fa-facebook-f"></i> Facebook</a>
                <a href="#" class="branch-item"><i class="fab fa-linkedin-in"></i> LinkedIn</a>
                <a href="#" class="branch-item"><i class="fab fa-telegram-plane"></i> Telegram</a>
                <a href="#" class="branch-item"><i class="fab fa-x-twitter"></i> Twitter</a>
            </div>
            <div class="core-icon" style="color: #00f2ff; border-color: #00f2ff;"><i class="fas fa-bolt"></i></div>
        </div>

        <div class="system-node">
            <div class="tool-bar">
                <input type="text" class="search-input" placeholder="اسأل النواة السيادية...">
            </div>
            <div class="core-icon"><i class="fas fa-search"></i></div>
        </div>

    </div>
</div>

</body>
</html>
