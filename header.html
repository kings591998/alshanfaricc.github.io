<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --cyan: #00f2ff; --bg: #050505; }
        body { background: transparent; margin: 0; padding: 10px 15px; font-family: sans-serif; overflow: visible; }

        .header-grid {
            display: flex;
            justify-content: space-between; /* اسم يسار وأيقونات يمين */
            align-items: center;
            width: 100%;
        }

        /* الاسم (أقصى اليسار) */
        .brand-left h1 { 
            font-size: 1rem; 
            color: var(--gold); 
            letter-spacing: 2px; 
            margin: 0; 
            font-weight: 900;
        }

        /* حاوية الأيقونات (أقصى اليمين) */
        .icon-tray-right {
            display: flex;
            gap: 8px; /* مسافة بين الأيقونات */
        }

        .node { position: relative; }

        /* الأيقونات الدائرية */
        .btn-core {
            width: 36px; height: 36px;
            border: 1px solid rgba(212,175,55,0.3); border-radius: 50%;
            background: #000; color: var(--gold);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; font-size: 0.8rem;
        }
        .btn-core:hover { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }

        /* القائمة المنسدلة المحدثة */
        .branch-menu {
            position: absolute;
            top: 45px;
            right: 0;
            width: 160px;
            background: rgba(10,10,10,0.98);
            border: 1px solid var(--gold);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            z-index: 9999; /* تظهر فوق البدي */
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
        }

        .node:hover .branch-menu { display: flex; }

        /* روابط التبويبات منفصلة ومرتبة */
        .link-node {
            color: var(--gold);
            text-decoration: none;
            font-size: 11px;
            padding: 12px;
            border-bottom: 1px solid rgba(212,175,55,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .link-node:last-child { border: none; }
        .link-node:hover { background: rgba(212,175,55,0.1); color: #fff; }

        /* حقل البحث */
        .search-box {
            background: transparent; border: none; border-bottom: 1px solid var(--gold);
            color: var(--gold); width: 90%; outline: none; font-size: 10px; padding: 5px; margin: 5px auto;
        }
    </style>
</head>
<body>

<div class="header-grid">
    
    <div class="brand-left">
        <h1>ALSHANFRICC</h1>
    </div>

    <div class="icon-tray-right">
        
        <div class="node">
            <div class="btn-core" onclick="window.history.back()"><i class="fas fa-chevron-right"></i></div>
        </div>

        <div class="node">
            <div class="btn-core" onclick="toggleLight()"><i class="fas fa-lightbulb"></i></div>
        </div>

        <div class="node">
            <div class="btn-core"><i class="fas fa-sitemap"></i></div>
            <div class="branch-menu">
                <a href="#" class="link-node"><i class="fas fa-pen-nib"></i> هندسة السرد</a>
                <a href="#" class="link-node"><i class="fas fa-chart-line"></i> عمارة الاستثمار</a>
                <a href="#" class="link-node"><i class="fas fa-robot"></i> الأنظمة الذكية</a>
                <a href="#" class="link-node"><i class="fas fa-database"></i> قواعد البيانات</a>
            </div>
        </div>

        <div class="node">
            <div class="btn-core" style="color:var(--cyan);"><i class="fas fa-bolt"></i></div>
            <div class="branch-menu">
                <a href="#" class="link-node"><i class="fab fa-telegram"></i> Telegram</a>
                <a href="#" class="link-node"><i class="fab fa-linkedin"></i> LinkedIn</a>
            </div>
        </div>

        <div class="node">
            <div class="btn-core"><i class="fas fa-search"></i></div>
            <div class="branch-menu" style="width: 200px;">
                <input type="text" class="search-box" placeholder="ابحث في النواة...">
            </div>
        </div>

    </div>
</div>

<script>
    function toggleLight() {
        // إرسال طلب للأب (index.html) لتغيير الثيم
        const body = window.parent.document.body;
        if (body.style.filter === "invert(100%)") {
            body.style.filter = "invert(0%)";
        } else {
            body.style.filter = "invert(100%)";
        }
    }
</script>
</body>
</html>
