<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --silver: #E5E4E2; }
        body { background: transparent; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; color: var(--gold); overflow: hidden; }

        .status-bar { width: 100%; display: flex; justify-content: space-between; padding: 8px 20px; font-size: clamp(7px, 1.5vw, 10px); letter-spacing: 1px; opacity: 0.6; border-bottom: 1px solid rgba(212,175,55,0.1); }

        .header-content { text-align: center; padding: 30px 10px; }

        .logo { 
            font-size: clamp(1.8em, 7vw, 3.8em); 
            letter-spacing: clamp(8px, 3vw, 18px); 
            font-weight: 900; text-transform: uppercase; margin: 15px 0;
            transition: 0.5s;
        }

        .subtitle { font-size: clamp(8px, 2vw, 11px); letter-spacing: 4px; opacity: 0.4; margin-bottom: 25px; }

        /* التبويبات المتجاوبة */
        .nav-vault { 
            display: flex; justify-content: center; gap: clamp(15px, 4vw, 35px); 
            margin: 20px auto; padding: 12px 0; flex-wrap: wrap;
            border-top: 1px solid rgba(212,175,55,0.1); border-bottom: 1px solid rgba(212,175,55,0.1);
            max-width: 90%;
        }

        .nav-item { color: var(--gold); text-decoration: none; font-size: clamp(10px, 2.5vw, 13px); font-weight: bold; letter-spacing: 1px; transition: 0.3s; }
        .nav-item:hover { transform: scale(1.1); text-shadow: 0 0 10px var(--gold); }

        .social-dock { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .social-dock a { color: var(--gold); font-size: clamp(14px, 3vw, 18px); opacity: 0.6; transition: 0.3s; text-decoration: none; }
        .social-dock a:hover { opacity: 1; transform: translateY(-3px); }
    </style>
</head>
<body>

<div class="status-bar">
    <div id="jubail-time">JUBAIL: --:--:--</div>
    <div class="coords">27.0117° N, 49.6583° E</div>
    <div>STATUS: <span style="color:#00ff00;">SOVEREIGN</span></div>
</div>

<div class="header-content">
    <h1 class="logo" id="main-logo">ALSHANFRICC</h1>
    <div class="subtitle">NARRATIVE ENGINEERING & INVESTMENT ARCHITECTURE</div>
    
    <nav class="nav-vault">
        <a href="info.html" target="_top" class="nav-item">مَن نحن</a>
        <a href="info.html" target="_top" class="nav-item">خدماتنا</a>
        <a href="info.html" target="_top" class="nav-item">الخصوصية</a>
        <a href="info.html" target="_top" class="nav-item" style="color:var(--silver);">البوابة</a>
    </nav>

    <div class="social-dock">
        <a href="#"><i class="fab fa-x-twitter"></i></a>
        <a href="#"><i class="fab fa-telegram-plane"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
    </div>
</div>

<script>
    function updateClock() {
        const opt = { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        document.getElementById('jubail-time').innerText = `JUBAIL: ${new Intl.DateTimeFormat('en-GB', opt).format(new Date())}`;
    }
    setInterval(updateClock, 1000);

    // حيلة الجيروسكوب للجوال (L5)
    if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
            const x = e.gamma / 4; const y = e.beta / 4;
            document.getElementById('main-logo').style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });
    }
</script>
</body>
</html>
