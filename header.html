<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --cyan: #00f2ff; }
        body { background: transparent; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 500px; }

        /* الحاوية الرئيسية للهيدر */
        .nav-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: flex-end; /* دفع كل شيء لليمين */
            padding-right: 20px;
            padding-top: 40px;
        }

        /* الاسم (محاذاة يمين بجانب الأيقونات) */
        .brand-box {
            margin-right: 20px; /* مسافة بينه وبين الأيقونات */
            text-align: right;
            margin-top: 5px;
        }
        .logo-text { 
            font-size: clamp(1.8em, 5vw, 2.5em); 
            color: var(--gold); 
            letter-spacing: 5px; 
            font-weight: 900; 
            margin: 0; 
            line-height: 1;
        }
        .tagline { font-size: 9px; color: var(--gold); opacity: 0.5; letter-spacing: 2px; }

        /* عمود الأيقونات الثلاث (على الحافة اليمنى) */
        .icon-column {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .node-item { position: relative; display: flex; align-items: center; }

        /* الدائرة الأم */
        .circle-trigger {
            width: 55px; height: 55px;
            border: 2px solid #222; border-radius: 50%;
            background: #000; color: var(--gold);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.4s; z-index: 10;
        }

        .node-item:hover .circle-trigger {
            border-color: var(--gold);
            box-shadow: 0 0 15px var(--gold), inset 0 0 10px var(--gold);
            transform: scale(1.05);
        }

        /* المستطيل الطافي (يظهر بجانب الأيقونة لليسار) */
        .floating-panel {
            position: absolute;
            right: 70px; /* يبدأ بعد الأيقونة مباشرة دون تغطيتها */
            height: 50px;
            width: 0;
            opacity: 0;
            background: rgba(15,15,15,0.9);
            border: 1px solid var(--gold);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0;
            overflow: hidden;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
            backdrop-filter: blur(8px);
            z-index: 5;
        }

        /* عند المرور فوق الأيقونة */
        .node-item:hover .floating-panel {
            width: 350px; /* عرض كافٍ للفروع */
            opacity: 1;
            padding: 0 20px;
        }

        /* أيقونات الفروع والروابط */
        .branch-link {
            color: var(--gold);
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            margin-left: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }
        .branch-link:hover { color: #fff; text-shadow: 0 0 10px var(--gold); }

        /* شريط التيار الكهربائي أسفل المستطيل */
        .power-bar {
            position: absolute; bottom: 0; left: 0;
            height: 2px; width: 0; background: var(--gold);
            box-shadow: 0 0 10px var(--gold);
            transition: 0.7s;
        }
        .node-item:hover .power-bar { width: 100%; }

        .search-field {
            background: transparent; border: none; border-bottom: 1px solid var(--gold);
            color: var(--gold); width: 100%; outline: none; font-size: 13px;
        }
    </style>
</head>
<body>

<div class="nav-container">
    
    <div class="brand-box">
        <h1 class="logo-text">ALSHANFRICC</h1>
        <div class="tagline">NARRATIVE ARCHITECT | CORE SYSTEM</div>
    </div>

    <div class="icon-column">
        
        <div class="node-item">
            <div class="floating-panel">
                <a href="#" class="branch-link"><i class="fas fa-pen-nib"></i> هندسة السرد</a>
                <a href="#" class="branch-link"><i class="fas fa-chart-line"></i> الاستثمار</a>
                <a href="#" class="branch-link"><i class="fas fa-robot"></i> الأتمتة</a>
                <div class="power-bar"></div>
            </div>
            <div class="circle-trigger"><i class="fas fa-sitemap"></i></div>
        </div>

        <div class="node-item">
            <div class="floating-panel">
                <a href="#" class="branch-link"><i class="fab fa-telegram-plane"></i> Telegram</a>
                <a href="#" class="branch-link"><i class="fab fa-linkedin-in"></i> LinkedIn</a>
                <a href="#" class="branch-link"><i class="fab fa-x-twitter"></i> Twitter</a>
                <div class="power-bar" style="background: var(--cyan); box-shadow: 0 0 10px var(--cyan);"></div>
            </div>
            <div class="circle-trigger" style="color:var(--cyan);"><i class="fas fa-bolt"></i></div>
        </div>

        <div class="node-item">
            <div class="floating-panel">
                <input type="text" class="search-field" placeholder="ابحث في السجلات...">
                <div class="power-bar"></div>
            </div>
            <div class="circle-trigger"><i class="fas fa-search"></i></div>
        </div>

    </div>
</div>

</body>
</html>
